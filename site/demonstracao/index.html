  if(s.unsub)sc["Marketing"]+=2;
  if(s.socialLbl)sc["Notificações"]+=3;
  if(s.forumLbl)sc["Notificações"]+=2;
  if(s.updLbl)sc["Notificações"]+=2;
  if(s.noreply&&!s.promoLbl)sc["Notificações"]+=2;
  if(!s.bulk&&evidenciaClientes(s))sc["Clientes"]+=1;
  /* M9: cobrança de verdade (conta + valor + vencimento) pesa como Financeiro, mesmo vinda de um contato conhecido
     ("Boleto cortinas - projeto Nunes": as palavras do projeto não fazem dela uma mensagem de cliente) */
  const tudo=s.n_sub+" "+s.n_body;
  if(!s.bulk&&!s.sig.auto&&!s.noreply&&sc["Clientes"]>=sc["Financeiro"]&&/\b(boletos?|faturas?|cobrancas?|guias?|parcelas?|mensalidades?)\b/.test(tudo)&&!/\b(preciso|precisamos|pode|poderia|consegue|conseguiria|favor|me (?:envia|manda|passa))\b/.test(s.n_body)&&/\b(vencimento|vence|vencem|vencera)\b/.test(tudo)&&(/r\$\s*\d/.test(tudo)||(s.M.att||[]).some(a=>/boleto|fatura/i.test(a.n||"")))&&/\b(segue|seguem|envio|enviamos|anexo|anexamos)\b/.test(tudo))sc["Financeiro"]+=2;
  /* M9: orçamento, proposta ou cotação enviados a você */
  s.ofertaRecebida=RE_OFERTA_FORNECEDOR.test(s.n_body)&&RE_OFERTA_CONFIRMA.test(s.n_body)&&s.lastWho!=="me";
  if(s.ofertaRecebida){sc["Fornecedores"]+=6;sc["Clientes"]=Math.max(0,sc["Clientes"]-2)}
  if(s.bulk&&sc["Financeiro"]>=3&&!s.promoLbl)sc["Financeiro"]+=1;
  if(s.sig.list&&!s.promoLbl&&sc["Marketing"]>=sc["Notificações"])sc["Marketing"]+=2;
  if(s.sig.auto&&!s.promoLbl)sc["Notificações"]+=2;
  if(s.sig.ics){sc["Reuniões"]+=8}
  if(/^(convite|convite atualizado|invitation|updated invitation)\s*:/.test(s.n_sub)||/\bconvidou voce\b/.test(s.n_body)){sc["Reuniões"]+=5}
  /* aprendizado com as suas correções */
  let learnMot=null;
  const model=s.model,M=s.M,cats=s.cats;
  if(model){
    const d=domOf(M.addr),dm=d&&!FREEMAIL.has(d)?model.dom[d]:null;
    if(dm){const tot=Object.values(dm).reduce((x,y)=>x+y,0),top=Object.keys(dm).sort((x,y)=>dm[y]-dm[x])[0];
      if(tot>=2&&dm[top]/tot>=0.7&&cats.includes(top)){sc[top]=(sc[top]||0)+6;learnMot="Você costuma classificar mensagens de @"+d+" como "+top}}
    const pr=predictCat(model,toks(s.subj+" "+s.subj+" "+s.cleanTxt.slice(0,1500),50),cats);
    if(pr&&pr.p>=0.75&&pr.n>=2){sc[pr.c]=(sc[pr.c]||0)+(pr.p>=0.9?5:3);if(!learnMot)learnMot="Parecida com mensagens que você classificou como "+pr.c}
  }
  s.sc=sc;s.learnMot=learnMot;
}
function escolherCategoria(s){
  const sc=s.sc,cats=s.cats;
  let cat="Clientes",best=-1;
  cats.forEach(c=>{if(sc[c]==null)sc[c]=0});
  cats.forEach(c=>{if(sc[c]>best){best=sc[c];cat=c}});
  /* sem nenhuma evidência: automática vai para Notificações; humana vai para Outros (neutra) se existir, senão Clientes */
  if(best<=0)cat=s.bulk&&cats.includes("Notificações")?"Notificações":cats.includes("Outros")?"Outros":"Clientes";
  const autoTxt=/(e-?mail|mensagem) (e |foi )?(gerad[oa] )?automatic|nao responda|nao responder (a )?este|do not reply|this is an automated/.test(s.n_body);
  const machine=(s.bulk||autoTxt)&&!s.known;
  s.cat=cat;s.best=best;
  s.maquina=machine;   /* enviada por sistema ou lista (sinais do remetente e do texto, não da categoria): usada na prioridade */
  s.auto=cat==="Marketing"||cat==="Notificações"||(machine&&cat!=="Financeiro"&&cat!=="Reuniões");
}
function motivosCategoria(s){
  const motivos=s.motivos,cat=s.cat,auto=s.auto,sig=s.sig;
  if(s.learnMot&&s.learnMot.indexOf(cat)>=0)motivos.push(s.learnMot);
  if(sig.ics&&cat==="Reuniões")motivos.push("Contém um convite de calendário");
  else if(s.promoLbl)motivos.push("Marcada como Promoções pelo Gmail");
  else if(s.updLbl&&cat==="Notificações")motivos.push("Marcada como Atualizações pelo Gmail");
  else if(sig.list&&auto)motivos.push("Enviada por lista de e-mails (tem descadastro)");
  else if(sig.auto&&auto)motivos.push("Mensagem gerada automaticamente");
  else if(s.noreply&&auto)motivos.push("Remetente automático ("+s.addrLoc+")");
  else if(s.unsub&&auto)motivos.push("Contém opção de cancelar inscrição");
  else if(cat==="Pessoal")motivos.push("Mensagem pessoal: família, amigos ou convite social");
  else if(cat==="Outros")motivos.push("Sem sinais suficientes para escolher uma categoria");
}

/* ---------- análise, etapa 4: datas, prazo e valores ----------
   Todas as datas e todos os valores são extraídos e classificados, com o trecho original como evidência.
   O prazo da mensagem é só um prazo, vencimento ou evento. Mensagens automáticas também têm datas lidas
   (uma conta vencendo ou uma consulta marcada continuam importantes); em promoções, datas e valores
   são só referência. */
function extrairPrazoValor(s){
  const now=s.now;let oferta=s.cat==="Marketing";
  /* M4: numa promoção, datas e valores continuam sendo só referência, MENOS quando há uma cobrança real: um vencimento
     cuja frase cita a conta (boleto, fatura...) e não é frase de oferta. Assim a categoria Marketing não apaga uma obrigação. */
  if(oferta){const ext0=datasDaMensagem(s.subj,s.cleanTxt,s.refUltima,now,{});
    if(ext0.C.some(c=>c.tipo==="vencimento"&&c.trecho&&RE_CONTA_NOME.test(nrm(c.trecho))&&!ehOferta(nrm(c.trecho)))){oferta=false;s.cobrancaEmPromocao=true}}
  /* M6.3: datas relativas a partir da data da mensagem; "hoje" continua sendo hoje */
  const ext=datasDaMensagem(s.subj,s.cleanTxt,s.refUltima,now,{oferta});
  let C=ext.C;
  /* M4.1: só datas válidas viram prazo. A lista completa (s.datas) não muda. */
  const validas=C.filter(c=>dataValida(c,ext.t,C));
  s._ext=ext;s._validas=validas;   /* usados pelas tarefas (M5): prazo de cada tarefa */
  if(s.sig.icsWhen){const w=s.sig.icsWhen;C=C.concat([{d:day0(w),w:3,ev:"convite de calendário",idx:0,len:0,regra:"calendário",tipo:"evento",pista:"convite de calendário",hora:p2(w.getHours())+":"+p2(w.getMinutes()),trecho:null}])}
  /* M9: o assunto só resume ("vence em 15 dias"); com prazo ou vencimento no texto, a data do assunto não é escolhida */
  const fimAssunto=ext.t.indexOf("\n"),noTexto=c=>c.idx>fimAssunto,tipoP=c=>c.tipo==="vencimento"||c.tipo==="prazo";
  const paraEscolher=fimAssunto>=0&&validas.some(c=>noTexto(c)&&tipoP(c))?validas.filter(c=>noTexto(c)||!tipoP(c)):validas;
  const pick=s.sig.icsWhen?C[C.length-1]:escolherPrazo(paraEscolher,ext.today);
  s.dl=pick?{iso:isoOf(pick.d),hora:pick.hora,ev:pick.ev,overdue:pick.d<ext.today,date:pick.d,tipo:pick.tipo,trecho:pick.trecho}:null;
  s.datas=listaDatas(C);
  s.valores=extrairValores(s.subj,s.cleanTxt,{oferta,temVencimento:C.some(c=>c.tipo==="vencimento")});
  const vp=oferta?null:valorPrincipal(s.valores);
  s.val=vp?{n:vp.n,s:vp.s,tipo:vp.tipo}:null;
}
/* M4.1: uma data de prazo, vencimento ou evento deixa de valer como prazo quando
     - a frase diz que o compromisso foi cancelado ("foi cancelada", "está cancelada", "desmarcamos");
       ameaças ("será cancelada se...") não contam;
     - a frase diz que ele foi remarcado e a data vem ANTES da palavra ("a reunião de amanhã foi remarcada para 17/11":
       vale só a data nova);
     - é um dia da semana seguido de uma data explícita diferente ("terça-feira, 17/11"): vale a data explícita. */
const RE_CANCEL_EVT=/\b(?:(?:foi|foram|esta|estao|ficou|ficaram) (?:cancelad|desmarcad)[oa]s?|cancelamos|desmarcamos|cancelei|desmarquei)\b/;
const RE_REMARCA=/\b(?:(?:remarcad|reagendad|adiad|transferid|antecipad|mudad|passad)[oa]s?|mudou|passou|ficou|fica) para\b|\bnova data\b/;
function dataValida(c,t,C){
  if(!TIPOS_DE_PRAZO[c.tipo])return true;
  if(c.regra==="dia da semana"){const fim=c.idx+c.len;
    if(C.some(o=>o!==c&&o.idx>fim&&o.idx<=fim+6&&o.regra!=="dia da semana"&&+o.d!==+c.d))return false}
  const [a,b]=limitesFrase(t,c.idx,c.idx+c.len),f=t.slice(a,b);
  const rm=f.match(RE_REMARCA);
  if(rm)return c.idx>=a+rm.index;
  return !RE_CANCEL_EVT.test(f);
}
/* ---------- análise, etapa 5: tipo da mensagem ---------- */
function definirTipo(s){
  const cat=s.cat,sig=s.sig;
  const T=s.n_sub+" "+s.n_body;
  let tipo="Mensagem";
  if(cat==="Marketing")tipo=/newsletter|boletim|edicao n/.test(T)?"Newsletter":"Promoção";
  else if(cat==="Notificações")tipo=/senha|seguranca|alerta|acesso|login|autentic|dispositivo/.test(T)?"Alerta de segurança":/recibo|compra|pedido|pagamento|fatura/.test(T)?"Recibo ou confirmação":"Notificação automática";
  else if(cat==="Reuniões")tipo=sig.ics||/convite|invitation|convidou/.test(T)?"Convite de reunião":"Agendamento de reunião";
  else if(cat==="Financeiro")tipo=/guia|imposto|darf|tributo/.test(T)?"Guia de imposto":/nota fiscal|notas fiscais|nf-?e|nfs-?e/.test(T)?"Nota fiscal":/comprovante|transferencia|pix|recibo/.test(T)?"Comprovante de pagamento":/boleto|fatura|cobranca|vencimento|vence|parcela|mensalidade/.test(T)?"Cobrança":"Assunto financeiro";
  else if(cat==="Fornecedores")tipo=/confirm/.test(T)&&/pedido/.test(T)?"Confirmação de pedido":/cotacao/.test(T)?"Cotação":/entrega|frete|rastre|despacho/.test(T)?"Entrega":/pedido/.test(T)?"Pedido":"Mensagem de fornecedor";
  else if(cat==="Pessoal")tipo="Mensagem pessoal";
  else{ /* clientes e outros */
    tipo=/orcamento|proposta/.test(T)?"Solicitação de orçamento":/contrato|assin/.test(T)?"Contrato":/duvida|\?/.test(s.n_body)?"Dúvida":/reclam|problema|erro|nao funciona/.test(T)?"Problema relatado":"Mensagem";
  }
  s.T=T;s.tipo=tipo;
}

/* ---------- análise, etapa 6: ação sugerida e "aguardando resposta" ---------- */
function definirAcao(s){
  const M=s.M,now=s.now,th=s.th,n_body=s.n_body,T=s.T,cat=s.cat,auto=s.auto,sig=s.sig,motivos=s.motivos;
  let acao=null;
  const tp=(s.pedidos||[])[0],askEf=!!s.askEfetivo;
  /* s.jaPago, s.debitoAuto e s.pagamento vêm de detectarObrigacoes (módulo 58) */
  /* conta a pagar numa notificação automática: vencimento + (valor a pagar, ou a frase do vencimento cita a conta),
     e nada de débito automático. Só a palavra "fatura" ou "boleto" na mensagem não basta. */
  const fraseVenc=s.dl&&s.dl.trecho?nrm(s.dl.trecho):"";
  const debitoAuto=s.debitoAuto;
  const citaConta=/\b(fatura|boleto|mensalidade|parcela|anuidade|sinal|cobranca|conta de (luz|energia|agua|gas|telefone|internet|celular)|aluguel|condominio|guia|imposto|iptu|ipva)\b/.test(fraseVenc);
  s.contaAPagar=!!(s.dl&&s.dl.tipo==="vencimento"&&!s.jaPago&&!debitoAuto&&!s.cancelada&&((s.valores||[]).some(v=>v.tipo==="a pagar")||citaConta));
  const ask=/\b(could you|can you|would you|please|let me know|preciso|precisamos|necessito|necessitamos|aguardo|envie|enviar|mande|me manda|encaminhe|solicito|poderia|pode|consegue|gostaria|favor|por favor|confirme|confirmar|responda|retorne|avise|me avisa)\b/.test(n_body);
  const noun=(()=>{const m=n_body.match(/\b(?:preciso|precisamos|necessito|aguardo|envie|enviar|mande|me manda|encaminhe|solicito|confirme|confirmar)\s+(?:d[oae]s?\s+|o\s+|a\s+|os\s+|as\s+|um\s+|uma\s+|seu\s+|sua\s+|suas?\s+|seus\s+)*([a-z]+(?:\s+fisca(?:l|is))?)/);
    if(!m)return null;const w=m[1];const f=NOUNS.find(([k])=>w.startsWith(k.split(" ")[0])&&(k.indexOf(" ")<0||m[1]===k));return f?f[1]:null})();
  const lastTs=(th[th.length-1]||{}).ts||M.ts||+now,ageD=Math.max(0,Math.floor((+now-lastTs)/86400000));
  const myLast=th.filter(m=>m.who==="me").pop();
  const iAsked=myLast&&s.lastWho==="me"&&(/\?/.test(String(myLast.clean||myLast.body||"").slice(0,1200))||/\b(aguardo|fico no aguardo|me avise|me retorne|pode confirmar|consegue)\b/.test(nrm(myLast.clean||myLast.body||"")));
  let waiting=false;
  if(s.lastWho==="me"){
    /* M5: vale para conversa com pessoa (remetente que não é sistema nem lista), em qualquer categoria */
    if(iAsked&&ageD>=3&&!s.maquina){waiting=true;acao="Cobrar retorno de "+(M.name||"remetente").split(/\s+/)[0];motivos.push("Você perguntou e não tem resposta há "+ageD+" dias")}
    /* M6.2: você respondeu por último, mas há tarefa sua pendente na conversa (por exemplo, um compromisso assumido) */
    else if(tp){acao=tp.texto==="Confirmar"?nomeConfirmar(T):tp.texto;motivos.push("Você respondeu por último; tarefa sua ainda pendente")}
    /* M9: você respondeu por último, mas a conta continua a pagar (pagou só uma parte, ou disse que vai pagar) */
    else if(s.pagamento&&!s.cancelada&&!s.pagamentoConcluido){acao=s.pagamento.acao;motivos.push("Você respondeu por último; a conta ainda está a pagar")}
    else motivos.push("Você respondeu por último");
  }
  /* M9: documento que vence (certificado, CNH, contrato...): renovar, não pagar */
  else if(s.renovacao&&cat!=="Marketing"){acao=s.renovacao.acao;motivos.push("Vence"+(s.renovacao.prazo?" em "+s.renovacao.prazo.split("-").reverse().slice(0,2).join("/"):"")+": é preciso renovar")}
  else if(cat==="Notificações"&&(s.contaAPagar||s.pagamento)&&!s.fwSemCobranca)acao=/boleto/.test(T)?"Pagar boleto":"Pagar fatura";
  /* M5: pedidos lidos frase a frase (módulo 59); o primeiro vira a ação principal quando não há cobrança.
     Em Notificações e em mensagens automáticas só valem pedidos de verbos transacionais (preencher, confirmar, anexar...);
     propaganda (Marketing) continua sem tarefa. */
  else if(cat==="Notificações"){if(s.tipo==="Alerta de segurança"&&M.unread)acao="Verificar alerta de segurança";else if(tp)acao=tp.texto}
  else if(cat==="Marketing"){}
  else if(auto){if(tp)acao=tp.texto}
  /* M6.4: num encaminhamento só para informar, comentar ou pedir opinião, as palavras de cobrança do assunto ou do conteúdo
     não são uma conta sua */
  else if(cat==="Financeiro"&&!s.fwSemCobranca&&/vence|vencimento|boleto|guia|fatura|cobranca|pagar|pagamento/.test(T)&&!/comprovante|pago|quitad[oa]|recebemos o pagamento|pagamento (?:ja )?(?:foi )?(?:feito|efetuado|realizado)/.test(T)&&!s.jaPago&&!s.debitoAuto&&!s.jaPagouQuemEscreve&&!s.pedeCobranca&&!s.cancelada)
    /* M9: um pagamento já nomeado pela conversa ("Pagar boleto (Condomínio Ipê)", do boleto anexado) não perde o nome */
    acao=tp&&/^Pagar /.test(tp.texto)?tp.texto:s.pagamento?s.pagamento.acao:/guia|imposto/.test(T)?"Pagar guia de imposto":/boleto/.test(T)?"Pagar boleto":"Pagar fatura";
  /* reserva: a regra de palavras de Financeiro não disparou (ex.: "comprovante" em outra frase), mas a obrigação foi provada */
  else if(cat==="Financeiro"&&s.pagamento)acao=s.pagamento.acao;
  else if(tp)acao=tp.texto==="Confirmar"?nomeConfirmar(T):tp.texto;
  /* reservas (regras anteriores), só com pedido real: fora de negação, cortesia e do que quem escreve vai fazer */
  else if(/confirm(e|ar|acao)/.test(n_body)&&askEf)acao=nomeConfirmar(T);
  else if(noun&&askEf)acao="Enviar "+noun;
  else if(/assin(e|ar|atura|ad[oa])|\bsign(ed)?\b/.test(n_body)&&askEf)acao="Assinar documento";
  else if(/revis(e|ar|ao)/.test(n_body)&&askEf)acao="Revisar material";
  /* obrigação de pagamento reconhecida fora de Financeiro, Notificações e Marketing (estas mantêm as regras próprias).
     Vem depois dos pedidos explícitos (confirmar, enviar, assinar, revisar) e antes das respostas genéricas. */
  else if(s.pagamento&&cat!=="Financeiro"&&cat!=="Notificações"&&cat!=="Marketing")acao=s.pagamento.acao;
  /* M5: "Agendar reunião" só quando há pedido para marcar (vem como tarefa do módulo 59); convite pede resposta */
  else if(cat==="Reuniões"&&(sig.ics||/convite|invitation|convidou/.test(T)))acao="Responder convite";
  else if(/\?/.test(s.cleanTxt)||askEf)acao="Responder a "+(M.name||"remetente").split(/\s+/)[0];
  s.acao=acao;s.ask=ask;s.ageD=ageD;s.waiting=waiting;
}

/* nome da confirmação sem objeto, como antes da M5 */
function nomeConfirmar(T){return /pedido/.test(T)?"Confirmar pedido":/reuniao|presenca|participacao/.test(T)?"Confirmar presença":"Confirmar"}
/* ---------- análise, etapa 7: prioridade (M4) ----------
   Calculada pelos sinais da mensagem, e não pela categoria. Não existe pontuação inicial: uma mensagem
   só sobe por um motivo concreto.
     relevância    cobrança pendente comprovada (módulo 58), pedido ou pergunta de uma pessoa, convite de calendário,
                   ou você esperando resposta
     prazo         o mais próximo que exige algo: vencimento de cobrança pendente, prazo ou evento futuro, mesmo sem
                   tarefa. Proporcional (M4.1): atrasado ou hoje 3, amanhã 2, 2-3 dias 1,5, 4-7 dias 0,5, mais longe 0.
                   Datas passadas, citadas, de eventos cancelados ou substituídas por remarcação não contam (módulo 63).
     urgência      palavra de urgência, só quando há pedido ou cobrança
     valor         só como reforço de uma cobrança pendente; valor alto sozinho não é urgência
     relação       estrela, "Importante" do Gmail, contato frequente, mensagem nova ou antiga
     aprendizado   as suas correções de prioridade para o remetente (mesmas regras de antes)
   A categoria só entra em duas regras explícitas:
     - Marketing (conteúdo comercial): pergunta ou pedido genérico não conta como pedido ao usuário,
       a não ser que seja urgente; cobrança comprovada continua contando.
     - alerta de segurança não lido fica pelo menos em média, venha de onde vier (sinal do texto).
   Converte em alta, média ou baixa conforme a sensibilidade escolhida. */
/* alerta de segurança dito no texto (acesso, login ou senha alterada que você talvez não reconheça).
   Só um código de verificação, que normalmente foi você que pediu, não é alerta. */
const RE_ALERTA_SEG=/\b(se nao foi voce|se voce nao reconhece|novo dispositivo|novo acesso|novo login|acesso a sua conta|tentativa de (?:login|acesso)|atividade suspeita|login suspeito|sua senha foi alterada|senha foi alterada|alteracao de senha)\b/;
const RE_URGENCIA=/\b(urgente|urgencia|imediat\w+|o quanto antes|asap|urgent|prioridade|critico)\b/;
function calcularPrioridade(s){
  const M=s.M,now=s.now,dl=s.dl,val=s.val,motivos=s.motivos,labels=s.labels,model=s.model,kc=s.kc,kd=s.kd,waiting=s.waiting,ageD=s.ageD;
  const maquina=!!s.maquina,comercial=s.cat==="Marketing",hoje=day0(now);
  const urgente=RE_URGENCIA.test(s.T);
  /* relevância */
  const obrig=!!((s.pagamento||s.contaAPagar)&&!s.cancelada);
  const perguntaOuPedido=s.lastWho!=="me"&&!maquina&&(s.ask||/\?/.test(s.cleanTxt));
  const pedido=perguntaOuPedido&&(!comercial||urgente);
  const convite=!!s.sig.ics&&s.lastWho!=="me";
  /* uma base só, mesmo que haja mais de um motivo (a cobrança e o "pode verificar?" sobre ela são o mesmo assunto) */
  let pts=0;
  if(obrig||pedido||convite||waiting){pts+=2;if(obrig)motivos.push("Cobrança pendente")}
  /* prazo: só conta quando exige algo de você. Vencimento sem cobrança pendente (já pago, débito automático,
     cancelado) e datas de outros tipos não aumentam a prioridade. Numa cobrança, um vencimento que já passou vale como atraso. */
  const venceuAntes=obrig&&(s.datas||[]).some(d=>d.tipo==="vencimento"&&d.iso<isoOf(hoje));
  const prazoConta=dl&&(dl.tipo==="vencimento"?obrig:true);
  if(dl&&!prazoConta)motivos.push("Cita data: \""+dl.ev+"\"");
  if(prazoConta||venceuAntes){const nd=dl?Math.round((dl.date-hoje)/86400000):null;
    if(venceuAntes||dl.overdue){pts+=3;motivos.push(dl&&dl.overdue?"Prazo já passou: "+dl.ev:"Vencimento já passou")}
    else if(nd<=0){pts+=3;motivos.push("Prazo hoje: \""+dl.ev+"\"")}
    else if(nd===1){pts+=2;motivos.push("Prazo amanhã: \""+dl.ev+"\"")}

      /* pelo nome (M6.6A), a não ser que o conteúdo lido diga outra coisa; pelo conteúdo (M6.6B), um boleto lido */
      const naoCobra=a=>{const c=docCat(a);return!!c&&c!=="boleto"};

      const cobra=[...new Set(cobraDoc.concat(rel.filter(a=>a.base==="nome"&&/^(boleto|fatura|guia)$/.test(a.categoria)&&!naoCobra(a))))];
      const textoAll=tm.t;
      if(cobra.length&&(!enc||/^(delegação|pedido|sem comentário)$/.test(itF||""))&&!RE_JA_PAGUEI.test(textoAll)&&!RE_DEBITO_AUTO.test(textoAll)&&!RE_CANCELADA.test(textoAll)&&!RE_QUITADA.test(textoAll)&&!RE_CT_PAGO.test(textoAll)){
        for(const a of cobra){const lido=docCat(a)==="boleto";
          /* vários boletos lidos na mesma mensagem: cada um é uma tarefa, identificada pelo beneficiário ou pelo vencimento */
          let texto=nomePagamento(lido?"boleto":a.categoria);
          if(lido&&cobraDoc.length>1){const b=docCampo(a,"beneficiario"),v=docCampo(a,"vencimento");texto+=b?" ("+b.valor+")":v?" (venc. "+v.valor.slice(8,10)+"/"+v.valor.slice(5,7)+")":" ("+a.nome+")"}
          let x=lido?T.find(y=>y.documentoId===a.documento.id):T.find(y=>y.verbo==="Pagar"&&!y.documentoId&&nrm(y.texto)===nrm(texto)&&y.situacao!=="concluida"&&y.situacao!=="cancelada");
          if(!x){const solic=enc&&itF!=="delegação"?fwdNome:nomeAutor||null;
            x={id:idTarefa(s.M.id||"",m.id||i,"anx","Pagar",lido?a.documento.id:a.categoria),texto,verbo:"Pagar",origem:"pagamento",chave:chaveDe(texto),natureza:"pedido",compromisso:false,
              situacao:"pendente",conclusao:null,solicitante:solic,solicitanteAddr:addrAutor,responsavel:"eu",origemMensagem:enc?"encaminhada":"anexo",encaminhadaPor:fwdNome,
              criadaEm:isoOf(ref),mensagem:i,prazo:null,hora:null,trecho:"Anexo: "+a.nome,pos:200000,eventos:[],evidencia:null,ultima:i,autorAddr:addrAutor};
            x.evidencia=evento(x,"criada",i,m,"Anexo: "+a.nome+(lido?" (boleto identificado pelo conteúdo do documento)":" (pista pelo nome do arquivo; o conteúdo não é lido)"));
            /* M6.6B: vencimento e valor do boleto lido. Só a linha digitável conferida dá o vencimento à tarefa (o prazo geral da
               mensagem e a prioridade não mudam). */
            if(lido){x.documentoId=a.documento.id;x.documentoAnexo=a.id;
              const v=docCampo(a,"vencimento"),val=docCampo(a,"valor");
              if(v&&v.nivel==="validado"){x.prazo=v.valor;x.prazoDocumento={documento:a.documento.id,campo:"vencimento",nivel:"validado",associacao:"tarefa criada a partir deste documento"}}
              if(val)x.valor={valor:val.valor,origem:"conteúdo",nivel:val.nivel,documento:a.documento.id};
              atribuir(a,x,[v&&v.nivel==="validado"?"vencimento":null,val?"valor":null].filter(Boolean),"associado","tarefa criada a partir deste documento")}
            /* encaminhado: a mensagem original (autor e data) fica como o pedido original */
            if(enc){const b=m.encaminhado[m.encaminhado.length-1],quem=b.de?(b.de.nome||b.de.addr):null;
              x.solicitanteOriginal=quem;x.pedidoOriginal={autor:quem,data:isoOf(dataCabecalho(b.data,ref)),trecho:"Anexo: "+a.nome};
              evento(x,"encaminhada",i,m,(encs[encs.length-1]||{}).evidencia||(m.texto||"").slice(0,200)||"(encaminhada sem comentário)")}
            T.push(x);criadosAqui.push(x)}
          ligarAnexo(x,a,"documento da tarefa")}}
    }
    /* 2. eventos frase a frase */
    for(const [fa,fb] of frases){
      const f=tm.t.slice(fa,fb),fo=tm.original(fa,fb),pal=palavrasDe(f);
      if(!f.trim())continue;
      const dataNaFrase=tm.validas.filter(c=>c.idx>=fa&&c.idx<fb&&TIPOS_DE_PRAZO[c.tipo]).sort((a,b)=>a.idx-b.idx)[0];
      const comPedido=criadosAqui.some(x=>x.eventos.some(e=>e.mensagem===i&&e.trecho===fo.trim()));
      if(m.autor==="outro"){
        const minhas=abertas().filter(x=>x.mensagem<i||x.ultima<i);
        /* cancelamento */
        const mc=f.match(RE_CT_CANCELA);
        if(mc&&!RE_CT_CONDICIONAL.test(f.slice(0,mc.index))){
          /* M9: só o trecho do cancelamento ("a planta baixa não precisa mais, só o contrato": o contrato continua) */
          const cortes=[0];let q;const rc=/[,;]|\b(?:mas|so|somente|apenas|exceto|menos)\b/g;while((q=rc.exec(f)))cortes.push(q.index);cortes.push(f.length);
          let ia=0;for(let k=0;k<cortes.length-1;k++)if(mc.index>=cortes[k])ia=k;
          const palTrecho=palavrasDe(f.slice(cortes[ia],cortes[ia+1]));
          let alvo=minhas.filter(x=>x.mensagem<i&&cruza(x.chave,palTrecho));
          if(!alvo.length)alvo=minhas.filter(x=>x.mensagem<i&&cruza(x.chave,pal));
          if(!alvo.length){const doAutor=minhas.filter(x=>x.mensagem<i&&(x.autorAddr===addrAutor||x.responsavel==="eu"));if(doAutor.length)alvo=[doAutor.sort((a,b)=>b.ultima-a.ultima)[0]]}
          alvo.forEach(x=>evento(x,"cancelada",i,m,fo,{situacao:"cancelada"}));
          if(alvo.length)continue}
        /* o solicitante diz que recebeu o objeto pedido */
        const mr=f.match(RE_CT_RECEBI);
        if(mr&&!/\bnao\s+(?:\w+\s+){0,1}$/.test(f.slice(0,mr.index))){
          const alvo=minhas.filter(x=>x.responsavel==="eu"&&x.mensagem<i&&cruza(x.chave,pal));
          alvo.forEach(x=>{evento(x,"concluida",i,m,fo,{situacao:"concluida"});x.conclusao="confirmada pelo solicitante"});
          if(alvo.length)continue}
        /* entrega do que VOCÊ pediu a essa pessoa */
        for(const [verbo,re] of CT_FEITO){const mf=f.match(re);if(!mf||RE_CT_FEITO_NEG.test(f.slice(0,mf.index))||RE_CT_FUTURO.test(f.slice(0,mf.index)))continue;
          const alvo=minhas.filter(x=>x.responsavel!=="eu"&&x.mensagem<i&&(cruza(x.chave,pal)||verbo===x.verbo));
          alvo.forEach(x=>{evento(x,"concluida",i,m,fo,{situacao:"concluida"});const v=verificarEntrega(x,m,f);x.conclusao=v.conclusao;x.verificacao=v.verificacao;ligarAnexo(x,v.anexo,"evidência de conclusão",s,v.verificacao)});break}
        /* novo prazo sem repetir o pedido ("pode ser até dia 20") */
        if(!comPedido&&dataNaFrase&&RE_CT_PRAZO.test(f)){
          let alvo=minhas.filter(x=>x.mensagem<i&&cruza(x.chave,pal)),ambiguo=false;
          /* M6.3: sem dizer de qual pedido, vale para a tarefa mais recente dessa pessoa. Se várias foram pedidas juntas, vale
             para a única que tinha prazo, ou para todas quando tinham o mesmo prazo; com prazos diferentes, nenhuma é alterada
             por suposição (a data fica marcada como ambígua). */
          if(!alvo.length){const doAutor=minhas.filter(x=>x.mensagem<i&&x.autorAddr===addrAutor);
            if(doAutor.length){const ult=Math.max(...doAutor.map(x=>x.ultima));let cand=doAutor.filter(x=>x.ultima===ult);
              const comPrazo=cand.filter(x=>x.prazo);if(cand.length>1&&comPrazo.length)cand=comPrazo;
              if(cand.length===1||cand.every(x=>x.prazo===cand[0].prazo))alvo=cand;else ambiguo=true}}
          const ed=entradaDe(i,dataNaFrase);
          if(ambiguo){if(ed)ed.ambiguo=true;continue}
          alvo.forEach(x=>{substituir(x);const hv=x.hora;x.prazo=isoOf(dataNaFrase.d);x.hora=dataNaFrase.hora||(RE_CT_MESMA_HORA.test(f)?hv:null);
            if(ed&&!ed.hora&&x.hora)ed.hora=x.hora;ligar(ed,x);evento(x,"prazo",i,m,fo,{situacao:"modificada"})});
          if(alvo.length)continue}
        /* M6.3: a mesma data repetida ("o prazo continua dia 10"): prazo mantido */
        if(!comPedido&&dataNaFrase){const iso=isoOf(dataNaFrase.d);
          const alvo=minhas.filter(x=>x.mensagem<i&&x.prazo===iso&&(cruza(x.chave,pal)||RE_CT_LEMBRETE.test(f)&&x.autorAddr===addrAutor));
          const ed=entradaDe(i,dataNaFrase);alvo.forEach(x=>{ligar(ed,x,"mantido");evento(x,"prazo mantido",i,m,fo)})}
        /* lembrete: a tarefa continua pendente */
        if(!comPedido&&RE_CT_LEMBRETE.test(f)){const a=minhas.filter(x=>x.mensagem<i&&x.autorAddr===addrAutor).sort((a,b)=>b.ultima-a.ultima)[0];if(a)evento(a,"lembrete",i,m,fo)}
      }else{
        const minhas=abertas().filter(x=>x.responsavel==="eu"&&x.mensagem<=i&&!criadosAqui.includes(x));
        /* pagamento feito por você */
        const mp=f.match(RE_CT_PAGO)||(/\bpago\b/.test(f)&&(temAnexo(m)||/\b(ja|ontem|cedo|comprovante)\b/.test(f))?["pago"]:null);
        /* guardado aqui e aplicado às tarefas de pagamento, se houver (montarTarefas) */
        if(mp&&i>ultimaOutro&&!RE_CT_FEITO_NEG.test(f.slice(0,mp.index||0))&&!RE_CT_PARCIAL.test(f)){
          const v=verificarEntrega({verbo:"Pagar",chave:new Set(),texto:"Pagar"},m,f,valoresCobranca());
          s.pagamentoConcluido={mensagem:i,autor:"eu",data:isoOf(ref),trecho:fo.trim(),conclusao:v.conclusao,verificacao:v.verificacao,anexo:v.anexo};
          /* M6.6A: a cobrança que veio só no anexo também fica paga */
          for(const x of abertas().filter(x=>x.verbo==="Pagar"&&x.mensagem<i&&x.responsavel==="eu")){evento(x,"concluida",i,m,fo,{situacao:"concluida"});x.conclusao=v.conclusao;x.verificacao=v.verificacao;ligarAnexo(x,v.anexo,"evidência de conclusão",s,v.verificacao)}
          continue}
        /* entrega sua */
        let concluiu=false;
        for(const [verbo,re] of CT_FEITO){const mf=f.match(re);if(!mf||RE_CT_FEITO_NEG.test(f.slice(0,mf.index))||RE_CT_FUTURO.test(f.slice(0,mf.index)))continue;
          let alvo=minhas.filter(x=>cruza(x.chave,pal));
          if(!alvo.length)alvo=minhas.filter(x=>x.verbo===verbo);
          /* M6.6A: sem objeto nem ação em comum, só as tarefas que têm um anexo compatível nesta mensagem */
          if(!alvo.length)alvo=minhas.filter(x=>(m.anexos||[]).some(a=>anexoComprova(a,x,f).ok===true));
          if(!alvo.length&&verbo==="*"&&minhas.length===1)alvo=minhas;
          alvo.forEach(x=>{evento(x,"concluida",i,m,fo,{situacao:"concluida"});const v=verificarEntrega(x,m,f,x.verbo==="Pagar"?valoresCobranca():null);x.conclusao=v.conclusao;x.verificacao=v.verificacao;ligarAnexo(x,v.anexo,"evidência de conclusão",s,v.verificacao)});
          if(alvo.length){concluiu=true;break}}
        if(concluiu)continue;
        /* só olhar, verificar, analisar: não é compromisso nem conclusão */
        if(RE_CT_SO_OLHAR.test(f)){const a=minhas.sort((a,b)=>b.ultima-a.ultima)[0];if(a)evento(a,"mantida",i,m,fo);continue}
        /* compromisso */
        RE_CT_COMPR.lastIndex=0;let mc;
        while((mc=RE_CT_COMPR.exec(f))){
          const antes=f.slice(0,mc.index);
          if(/\b(o|a|os|as|do|da|no|na|pelo|pela|ao|um|uma|seu|sua|meu|minha)\s+$/.test(antes)||/\bnao\s+(?:\w+\s+){0,1}$/.test(antes)||RE_CT_CONDICIONAL.test(antes))continue;
          const verbo=mc[1]?CT_INF[mc[1]]:CT_PRIMEIRA[mc[2]];
          const obj=tkObjeto(tm.t,fa+mc.index+mc[0].length,fb);
          let objTxt=obj?tm.original(obj[0],obj[1]).replace(/\s+/g," ").trim():null;
          /* "te ligo mais tarde", "respondo em breve": expressão de tempo não é objeto */
          if(objTxt&&/^(mais tarde|em breve|assim que puder|o quanto antes|logo mais)\b/i.test(nrm(objTxt)))objTxt=null;
          /* M8.1: "vou pagar os dois", "mando tudo amanhã": quantidade ou pronome não é objeto (antes virava a tarefa "Pagar dois") */
          if(objTxt&&/^(?:(?:os|as|esses|essas|estes|estas)\s+)?(?:dois|duas|tres|ambos|ambas|todos|todas|tudo|isso|isto|esses|essas|eles|elas|os dois|as duas)\b(?:\s+(?:hoje|amanha|depois|logo|ja|agora|sim|tambem|juntos|juntas))*\s*[.!?]*$/.test(nrm(objTxt).replace(/\s+(ate|na|no|em|de)\s+.*$/,"")))objTxt=null;
          const chave=objTxt?chaveDe("x "+objTxt):new Set();
          let alvo=chave.size?minhas.filter(x=>cruza(x.chave,chave)):[];
          /* sem objeto: a tarefa da mesma ação; ou a mais recente, salvo para "te ligo"/"te respondo" (contato não assume a tarefa) */
          if(!alvo.length&&!chave.size){const a=minhas.filter(x=>verbo==="*"||x.verbo===verbo).sort((a,b)=>b.ultima-a.ultima)[0]||(verbo!=="Ligar"&&verbo!=="Responder"?minhas.sort((a,b)=>b.ultima-a.ultima)[0]:null);if(a)alvo=[a]}
          if(alvo.length){alvo.forEach(x=>{x.compromisso=true;x.natureza="compromisso";
              if(dataNaFrase){const iso=isoOf(dataNaFrase.d),ed=entradaDe(i,dataNaFrase);
                if(x.prazo===iso)ligar(ed,x,"mantido");else{substituir(x);x.prazo=iso;x.hora=dataNaFrase.hora||null;ligar(ed,x)}}
              evento(x,"compromisso",i,m,fo)});break}
          if(objTxt&&verbo!=="*"){
            const o=/^[A-ZÀ-Ú0-9]{2,}\b/.test(objTxt)?objTxt:objTxt.charAt(0).toLowerCase()+objTxt.slice(1);
            const x={id:idTarefa(s.M.id||"",m.id||i,verbo,[...chave].sort().join(" ")),texto:verbo+" "+o,verbo,origem:"compromisso",chave,
              natureza:"compromisso",compromisso:true,situacao:"pendente",conclusao:null,solicitante:null,solicitanteAddr:outros.length?outros[0].addr:null,responsavel:"eu",origemMensagem:"direta",
              criadaEm:isoOf(ref),mensagem:i,prazo:dataNaFrase?isoOf(dataNaFrase.d):null,hora:dataNaFrase?dataNaFrase.hora||null:null,trecho:fo.trim(),
              pos:fa+mc.index,eventos:[],evidencia:null,ultima:i,autorAddr:addrAutor};
            x.evidencia=evento(x,"compromisso",i,m,fo);T.push(x);criadosAqui.push(x);if(dataNaFrase)ligar(entradaDe(i,dataNaFrase),x)}
          break;
        }
      }
    }
    /* 3. eventos (reunião, visita, consulta...) desta mensagem: novo, remarcado ou cancelado */
    for(const [fa,fb] of frases){
      const f=tm.t.slice(fa,fb);if(!f.trim())continue;
      const livres=entradasNa(fa,fb,e=>!e.tarefas.length&&!e.ambiguo);
      const palavra=(f.match(RE_EVENTO)||[])[1]||null;
      const anteriores=eventosConv.filter(e=>e.mensagem<i&&!e.substituido&&!e.cancelado);
      const doMesmo=l=>palavra?l.filter(e=>e.evento===palavra):[];
      const mcanc=f.match(RE_CANCEL_EVT);
      if(mcanc&&!RE_CT_CONDICIONAL.test(f.slice(0,mcanc.index))){
        let alvo=anteriores.filter(e=>livres.some(l=>l.data===e.data));if(!alvo.length)alvo=doMesmo(anteriores);
        if(!alvo.length&&anteriores.length&&!livres.length)alvo=[anteriores[anteriores.length-1]];
        alvo.forEach(e=>{e.cancelado=true});livres.forEach(e=>{e.cancelado=true});continue}
      /* proposta em pergunta ("podemos passar para segunda?") não remarca nada: a data fica como proposta */
      if(anteriores.length&&livres.length&&RE_CT_MUDA_DATA.test(f)&&/\?\s*$/.test(f)){livres.forEach(e=>{e.proposta=true});continue}
      if(anteriores.length&&livres.length&&RE_CT_MUDA_DATA.test(f)&&!/\?\s*$/.test(f)){
        let alvo=doMesmo(anteriores);if(!alvo.length)alvo=[anteriores[anteriores.length-1]];
        const nova=livres.find(e=>!alvo.some(a=>a.data===e.data)&&!(e.natureza==="referência"&&RE_REF.test(f)));
        if(nova){alvo.forEach(a=>{a.substituido=true});
          nova.natureza="evento";nova.evento=alvo[0].evento;nova.remarcacao=true;nova.valida=true;
          if(!nova.hora&&RE_CT_MESMA_HORA.test(f))nova.hora=alvo[0].hora;eventosConv.push(nova);continue}}
      for(const e of livres)if(e.natureza==="evento"&&e.valida){e.evento=palavra;eventosConv.push(e)}
    }
  }
  /* situação final de cada data */
  for(const e of cron){
    if(e.ambiguo){e.situacao="ambíguo";continue}
    if(e.tarefas.length){
      const st=e.tarefas.map(id=>{const x=T.find(t=>t.id===id);return x.situacao==="cancelada"?"cancelado":x.situacao==="concluida"?"cumprido":e.estado[id]});
      e.situacao=st.includes("vigente")?"vigente":st.includes("mantido")?"mantido":st.includes("substituído")?"substituído":st.includes("cumprido")?"cumprido":"cancelado";
      continue}
    if(e.cancelado){e.situacao="cancelado";continue}
    if(e.proposta){e.situacao="proposta";continue}
    if(e.substituido){e.situacao="substituído";continue}
    if(e.natureza==="prazo"||e.natureza==="evento"){
      e.situacao=e.c.passado?"passado":e.valida?"vigente":RE_CANCEL_EVT.test(nrm(e.trecho||""))||cron.some(o=>o!==e&&o.mensagem===e.mensagem&&o.frase===e.frase&&o.cancelado)?"cancelado":"substituído";
      continue}
    e.situacao="informativa";
  }
  /* M6.6A: anexos da conversa, cada um com as tarefas a que está ligado */
  s.cronologia=cron;s.encaminhamentos=encs;s.pessoas=pessoasDaConversa(msgs,T,self);
  /* prazo da mensagem (última mensagem da outra pessoa): sem as datas já substituídas, cumpridas ou canceladas na conversa,
     e com a data nova de um evento remarcado nela */
  const uo=cron.filter(e=>e.mensagem===ultimaOutro);
  const fora=new Set(uo.filter(e=>e.valida&&/^(substituído|cumprido|cancelado)$/.test(e.situacao)).map(e=>e.data));
  for(const e of uo)if(/^(vigente|mantido)$/.test(e.situacao))fora.delete(e.data);
  /* remarcação na última mensagem da outra pessoa ou depois dela (inclusive sua: "combinado, vamos passar para segunda") */
  s.ajustePrazo={fora,novas:cron.filter(e=>e.mensagem>=ultimaOutro&&e.remarcacao&&e.situacao==="vigente")};
  s.historico=T;
  /* tarefas pendentes suas, da atividade mais recente para a mais antiga (na mesma mensagem, na ordem do texto) */
  s.pedidos=abertas().filter(x=>x.responsavel==="eu").sort((a,b)=>b.ultima-a.ultima||a.mensagem-b.mensagem||a.pos-b.pos)
    .map(x=>({texto:x.texto,verbo:x.verbo,origem:x.origem,prazo:x.prazo,hora:x.hora,trecho:x.trecho,id:x.id}));
}

/* M6.3: prazo da mensagem conferido com a conversa. Só muda quando a conversa mostra que a data da última mensagem da outra
   pessoa já não vale (substituída, cumprida ou cancelada) ou quando ela remarca um evento anterior; em todo o resto, fica
   exatamente como foi calculado na etapa 4. */
function prazoDaConversa(s){
  const a=s.ajustePrazo;if(!a||!a.fora.size&&!a.novas.length||s.sig.icsWhen)return;
  const hoje=day0(s.now);
  const C=(s._validas||[]).filter(c=>!a.fora.has(isoOf(c.d))).concat(a.novas.map(e=>({...e.c,tipo:"evento",w:3,hora:e.hora,pista:"remarcação"})));
  const pick=escolherPrazo(C,hoje);
  s.dl=pick?{iso:isoOf(pick.d),hora:pick.hora,ev:pick.ev,overdue:pick.d<hoje,date:pick.d,tipo:pick.tipo,trecho:pick.trecho}:null;
}

/* M6.4: pessoas da conversa e o papel de cada uma: autor (escreveu uma mensagem da conversa), encaminhou, remetente original e
   destinatário original (de uma mensagem encaminhada), solicitante, solicitante original, responsável e mencionada (só citada
   no texto, como "fale com a Paula"). Você aparece como "você". */
function pessoasDaConversa(msgs,T,self){
  const P=[];

       corrigido ou a segunda via chega numa mensagem seguinte. Quando a conversa tem mais de uma cobrança, o desempate usa o

const idVerbo=texto=>{const w=nrm(texto).split(/[^a-z0-9]+/).filter(Boolean)[0]||"";return CS_VERBO[w]||w};

/* identificadores antigos → chaves, nas conversas analisadas (buildMail). Um identificador antigo que aparece em duas tarefas

function equivalenciaIds(mails){
  const mapa={},ambiguos=[],visto=new Map();

    const k=String(m.id)+"\u0001"+t.id;if(visto.has(k)&&visto.get(k)!==t.chave){if(!ambiguos.includes(t.id))ambiguos.push(t.id);continue}visto.set(k,t.chave)}

  const achar=k=>grupos.findIndex(g=>itens(g).some(x=>x.t.chave===k));
  const novo=(lista,motivo)=>{const o=lista.slice().sort((a,b)=>(a.t.criadaEm||"").localeCompare(b.t.criadaEm||"")||(a.t.chave<b.t.chave?-1:1));

/* ---------- obrigações financeiras e prioridade por tarefa no registro (M7.3) ----------

   - pagamento declarado: alguém disse que pagou (ou houve um comprovante só pelo nome, ou sem valor conferido);
   - agendado: comprovante de agendamento, ou mensagem dizendo que o pagamento foi agendado — continua aberto;
   - vencida: aberta e com o vencimento já passado (inclusive vencimento citado no passado, que não vira prazo da tarefa).
   Valor devido ≠ valor mencionado: o devido vem do documento da cobrança ou do valor "a pagar" da PRÓPRIA frase da cobrança;
   sem isso, fica sem valor (e os valores citados ficam listados à parte). Uma obrigação é contada uma vez só: cada entrada do registro

const RE_OB_AGENDADO=/\b(agendei|agendamos|agendad[oa]s?|agendamento)\b[^.!?\n]{0,40}\b(pagamento|pix|boleto|fatura|conta|transferencia|ted)\b|\b(pagamento|pix|boleto|fatura|conta|transferencia)\b[^.!?\n]{0,30}\b(agendad[oa]|foi agendad[oa])\b/;
const RE_OB_COBRANCA=/\b(fatura|boleto|conta|mensalidade|vencimento|vence|vencid[oa]|cobranca|parcela|debito)\b/;
const RE_OB_VENC=/\b(vencimento|vence|venceu|vencid[oa]|vencer)\b/;

/* prioridade por tarefa: alta, média, baixa, ou null para tarefa encerrada */
function prioridadeDaTarefa(e,hoje){
  if(e.situacao==="concluida"||e.situacao==="cancelada"||e.situacao==="descartada")return{prioridade:null,motivos:["tarefa encerrada"]};
  if(e.generica)return{prioridade:e.conversaPrioridade||"baixa",motivos:["resposta genérica: segue a prioridade da conversa"]};
  let p=0;const mot=[];
  const ob=e.obrigacao;
  const prazo=ob&&ob.vencimento?ob.vencimento.data:e.prazo;
  if(prazo){const d=obDias(prazo,hoje);const pts=d<=0?3:d===1?2:d<=3?1.5:d<=7?0.5:0;
    if(pts){p+=pts;mot.push(d<0?"prazo vencido":d===0?"prazo hoje":d===1?"prazo amanhã":"prazo em "+d+" dias")}}
  if(ob&&(ob.estado==="a pagar"||ob.estado==="vencida")){p+=1;mot.push("cobrança em aberto")}
  if(ob&&ob.estado==="agendado"){p-=1;mot.push("pagamento já agendado")}
  if(!ob&&e.natureza==="pedido"&&e.solicitante&&e.responsavel==="eu"){p+=1;mot.push("pedido feito a você")}
  if(e.compromisso&&e.responsavel==="eu"){p+=1;mot.push("compromisso seu")}
  if(e.trechos.some(t=>RE_TK_URGENTE.test(nrm(t)))){p+=1;mot.push("pedido urgente")}
  let prioridade=p>=3?"alta":p>=1.5?"média":"baixa";
  if(e.situacao==="aguardando"){prioridade=prazo&&obDias(prazo,hoje)<=0?"média":"baixa";mot.push("outra pessoa vai fazer")}
  return{prioridade,motivos:mot.length?mot:["sem prazo nem sinal de urgência"]};

function aplicarObrigacoes(reg,M,ctx){
  const hoje=ctx.now?isoOf(new Date(ctx.now)):"9999-12-31",porId=new Map(M.map(m=>[m.id,m]));
  for(const e of reg.tarefas){
    if(idVerbo(e.descricao)==="pagar"&&!e.generica)e.obrigacao=obrigacaoDe(e,[...new Set(e.origens.map(o=>o.conversa))].map(id=>porId.get(id)).filter(Boolean),hoje);

     só quando a conversa tem a frase da cobrança E uma mensagem que cancela a cobrança */

      valorDevido:vs.length===1?{valor:vs[0],centavos:obCentavos(vs[0]),origem:"texto",nivel:"declarado"}:null,emissor:m.name||null,emissorAddr:m.addr||null})}

function resumoObrigacoes(T,extras){
  const ESTADOS=["a pagar","vencida","pagamento declarado","agendado","confirmado","cancelada"];
  const totais={};for(const s of ESTADOS)totais[s]={quantidade:0,centavos:0,semValor:0};
  const lista=[];
  for(const e of T){const o=e.obrigacao;if(!o||o.duplicadaDe)continue;const t=totais[o.estado];t.quantidade++;

function replyText(e,tone){
  const f=(e.name||e.from).split(/\s+/)[0],me=first(),core=e.core||"Obrigado pela mensagem. Retorno em breve.";
  return tone==="formal"?`Prezado(a) ${f},\n\n${core}\n\nAtenciosamente,\n${PROFILE.name}`:tone==="direto"?`${f},\n\n${core}\n\n${me}`:`Olá, ${f}!\n\n${core}\n\nUm abraço,\n${me}`;
}
function vReply(id){

<div class="chips" style="margin:6px 0 10px">${[["cordial","Cordial"],["formal","Formal"],["direto","Direto"]].map(([k,t])=>`<button class="chip ${r.tone===k?"on":""}" data-a="tone" data-v="${k}" data-id="${id}">${t}</button>`).join("")}</div>

/* ---------- categoria, busca, notificações, insights ---------- */
function vCat(n){const l=inbox().filter(e=>e.a.categoria===n).sort((a,b)=>b.ts-a.ts),c=cats().find(x=>x.n===n)||DEF_CATS[0];
  return `<div class="pg"><button class="back" data-a="back">${ic("chevL",24)}Categorias</button><div class="hd" style="justify-content:flex-start;gap:14px"><span class="tile" style="width:46px;height:46px">${ic(c.i,24)}</span><h1 class="t" style="font-size:28px">${esc(n)}</h1></div>${l.length?l.map(e=>row(e)).join(""):`<div class="empty">Nenhuma mensagem nesta categoria.</div>`}</div>`}
function searchRes(){
  const q=norm(S.search.q.trim()),f=S.search.f;
  let l=S.emails.filter(inRange).filter(e=>{const a=e.a;
    if(f==="clientes"&&a.categoria!=="Clientes")return false;if(f==="prazos"&&!a.prazoData)return false;if(f==="valores"&&!a.valor)return false;if(f==="anexos"&&!e.att.length)return false;
    return !q||norm([e.from,e.name,e.addr,e.subject,latest(e),a.resumo,a.valor,a.acao,a.categoria,a.tipo,e.att.map(x=>x.n).join(" ")].join(" ")).includes(q)});
  l.sort((x,y)=>S.search.sort==="rec"||!q?y.ts-x.ts:(norm(y.from+y.subject).includes(q)?1:0)-(norm(x.from+x.subject).includes(q)?1:0)||y.ts-x.ts);
  const ch=(k,t)=>`<button class="chip ${f===k?"on":""}" data-a="sf" data-v="${k}">${t}</button>`;
  let h=`<div class="chips sc" style="margin-top:14px">${ch("todas","Todas")}${ch("clientes","Clientes")}${ch("prazos","Prazos")}${ch("valores","Valores")}${ch("anexos","Anexos")}</div>`;
  if(!q&&f==="todas"&&RECENTS.length)h+=`<div class="sec"><h2 class="s" style="font-size:15px">Buscas recentes</h2><button class="link" data-a="clearrec">Limpar</button></div>${RECENTS.map((r,i)=>`<div class="lr" style="padding:11px 2px" role="button" tabindex="0" data-a="recent" data-v="${esc(r)}"><span class="ic mu">${ic("clock",19)}</span><span class="bd"><b style="font-weight:500;font-size:15px">${esc(r)}</b></span><button class="icbtn" style="width:32px;height:32px" data-a="delrec" data-v="${i}" aria-label="Remover ${esc(r)}">${ic("x",17)}</button></div>`).join("")}<div class="gh">Todas as mensagens</div>`;
  else h+=`<div class="sec" style="margin-top:4px"><span class="mu sm">${l.length} resultado${l.length===1?"":"s"}</span><button class="link" data-a="ssort">${ic("sort",15)}${S.search.sort==="rec"?"Mais recentes":"Relevância"}</button></div>`;
  return h+(l.length?l.map(e=>`<button class="lr" data-a="open" data-v="${e.id}">${avatar(e.from)}<span class="bd"><b>${hl(e.subject,q)}</b><small>${hl(e.from,q)} · ${esc([e.a.valor,e.a.prazoData?dueLabel(e.a.prazoData,e.a.prazoHora):null,fmtTime(e.ts)].filter(Boolean).join(" · "))}</small></span><span class="mu">${ic("chevR",18)}</span></button>`).join(""):`<div class="empty">Nada encontrado para "${esc(S.search.q)}".</div>`);
}
function vSearch(){return `<div class="pg"><div style="display:flex;gap:8px;align-items:center"><button class="icbtn" data-a="back" aria-label="Voltar" style="margin-left:-8px">${ic("chevL",24)}</button><div class="sbar" style="margin:0;flex:1">${ic("search",20)}<input id="sq" style="background:none;border:0;padding:0;color:var(--tx);width:100%;outline:none;font-size:15px" placeholder="Nome, valor, prazo, anexo…" value="${esc(S.search.q)}" autocomplete="off" data-bind="sq" aria-label="Buscar mensagens">${S.search.q?`<button data-a="sclear" aria-label="Limpar busca" style="display:grid">${ic("x",18)}</button>`:""}</div></div><div id="sres">${searchRes()}</div></div>`}
function vNotifs(){
  const k={prazo:"clock",prio:"star",dia:"sparkle",sys:"checkC",teste:"bell"};
  return `<div class="pg"><div class="dh" style="margin-bottom:6px"><button class="icbtn" data-a="back" aria-label="Voltar">${ic("chevL",24)}</button><div class="r"><button class="link" data-a="readall" style="padding:0 6px">Marcar como lidas</button></div></div><h1 class="tt">Notificações</h1>
${S.notifs.length?S.notifs.map(n=>`<button class="nt ${n.read?"":"unr"}" data-a="notif" data-v="${n.id}"><span class="tile">${ic(k[n.kind]||"bell",20)}</span><span class="bd"><span class="t1">${esc(n.title)}</span><span class="t2">${esc(n.text||"")}</span><span class="t3">${esc(fmtTime(n.ts))}${n.quiet?" · silenciada":""}</span></span>${n.read?"":`<span class="pt"></span>`}</button>`).join("")+`<button class="link" style="margin:16px auto 0" data-a="clearnotifs">Limpar tudo</button>`:`<div class="empty">${ic("bell",34)}<p style="margin-top:8px">Nenhuma notificação.</p></div>`}</div>`;
}
function vInsights(){
  const L=S.emails.filter(inRange),all=tasks(),dn=all.filter(t=>t.done).length;
  const days=[];for(let i=-6;i<=0;i++){const s=T(i,0),e=T(i+1,0);days.push({l:WDS[new Date(s).getDay()],v:L.filter(m=>m.ts>=s&&m.ts<e).length})}
  const mx=Math.max(1,...days.map(d=>d.v)),cc=cats().map(c=>({n:c.n,v:L.filter(m=>m.a.categoria===c.n).length})).filter(c=>c.v),cm=Math.max(1,...cc.map(c=>c.v));
  const sum=all.filter(t=>!t.done&&t.kind==="mail").reduce((x,t)=>x+parseBRL(t.e.a.valor),0);
  const up=L.filter(m=>m.fbk===1).length,corr=fixes.length;
  return `<div class="pg"><button class="back" data-a="back">${ic("chevL",24)}Voltar</button><h1 class="tt">Visão da semana</h1><p class="mu">Calculado com as suas mensagens e tarefas.</p>
<div class="kp" style="margin-top:16px"><div class="stat"><b>${L.length}</b><span>Mensagens analisadas</span></div><div class="stat"><b>${dn}/${all.length}</b><span>Tarefas concluídas</span></div><div class="stat"><b style="font-size:17px;padding-top:6px">${brl(sum).replace("R$ ","R$ ")}</b><span>Valores em pendências</span></div></div>
<div class="card"><h3>Mensagens por dia</h3><div class="bars">${days.map(d=>`<div class="b"><em>${d.v}</em><i style="height:${Math.max(4,d.v/mx*80)}px"></i><span>${d.l}</span></div>`).join("")}</div></div>
<div class="card" style="margin-top:12px"><h3>Por categoria</h3>${cc.map(c=>`<div class="hb"><span>${esc(c.n)}</span><span class="tr"><i style="width:${c.v/cm*100}%"></i></span><b>${c.v}</b></div>`).join("")}</div>
<div class="card" style="margin-top:12px"><h3>Qualidade da análise</h3><p>${up} ${up===1?"mensagem marcada":"mensagens marcadas"} como útil, ${corr} ${corr===1?"correção":"correções"} salvas e ${RULES.length} ${RULES.length===1?"regra aprendida":"regras aprendidas"}.</p><button class="link" style="margin-top:8px" data-a="set" data-v="regras">Ver regras aprendidas ${ic("chevR",15)}</button></div></div>`;
}

  (P.quiet?`<div class="lr plain"><span class="bd"><b>Das</b></span><input class="in" type="time" data-set="qFrom" value="${P.qFrom}" style="width:auto" aria-label="Início"><span class="bd" style="flex:none;padding:0 6px"><b>às</b></span><input class="in" type="time" data-set="qTo" value="${P.qTo}" style="width:auto" aria-label="Fim"></div>`:"")+
  `<div class="stack" style="margin-top:16px"><button class="btn o" data-a="testnotif">${ic("bell",19)}Enviar notificação de teste</button></div><p class="note">Nesta versão as notificações aparecem só dentro do app.</p>`],
 pref:["Preferências de análise",()=>`<label class="lab">Sensibilidade das prioridades</label>${segHTML("sens",[["cons","Conservador"],["eq","Equilibrado"],["agr","Agressivo"]],P.sens)}
  ${tgrow("learn","Aprender com minhas correções","O algoritmo aprende com cada correção e confirmação")}${tgrow("autoTasks","Criar tarefas automaticamente","Transforma a ação sugerida em tarefa")}${tgrow("newsLow","Newsletters com baixa prioridade","Evita que promoções ocupem seu início")}${tgrow("showVal","Mostrar valores extraídos","Exibe o valor em R$ no detalhe da mensagem")}${tgrow("showConf","Mostrar confiança da análise","Indica quão seguro o algoritmo está de cada análise")}${tgrow("showWhy","Mostrar o porquê da classificação","Lista os sinais usados pelo algoritmo")}
  <div class="lr plain"><span class="bd"><b>Correções salvas</b><small>${fixes.length} ${fixes.length===1?"correção":"correções"}</small></span>${fixes.length?`<button class="pill g" data-a="clearfix">Limpar</button>`:""}</div>
  <div class="lr plain"><span class="bd"><b>Motor de análise</b><small>${esc(aiStatus())}</small></span></div>
  <div class="stack" style="margin-top:16px"><button class="btn" data-a="reanalyze">${ic("refresh",19)}Reanalisar todas as mensagens</button></div>`],
 regras:["Regras aprendidas",()=>`<p class="mu">Quando você corrige uma análise e escolhe "sempre", o Assistence guarda uma regra para aquele remetente.</p>
  ${RULES.length?RULES.map(r=>`<div class="lr plain">${avatar(r.from)}<span class="bd"><b>${esc(r.from)}</b><small>${r.mute?"Silenciado (prioridade baixa)":[r.categoria?"Categoria: "+r.categoria:"",r.prioridade?"Prioridade: "+r.prioridade:""].filter(Boolean).join(" · ")}</small></span><button class="icbtn" data-a="delrule" data-v="${r.id}" aria-label="Excluir regra de ${esc(r.from)}">${ic("trash",19)}</button></div>`).join(""):`<div class="empty">${ic("rule",32)}<p style="margin-top:8px">Nenhuma regra ainda.</p></div>`}
  <div class="stack" style="margin-top:16px"><button class="btn o" data-a="newrule">${ic("plus",19)}Nova regra</button></div>`],
 categorias:["Categorias",()=>cats().map(c=>`<div class="lr plain"><span class="tile">${ic(c.i,21)}</span><span class="bd"><b>${esc(c.n)}</b><small>${c.custom?"Personalizada":"Padrão"}</small></span>${c.custom?`<button class="icbtn" data-a="catedit" data-v="${esc(c.n)}" aria-label="Editar ${esc(c.n)}">${ic("edit",19)}</button>`:`<span class="mu">${ic("lock",17)}</span>`}</div>`).join("")+`<div class="stack" style="margin-top:16px"><button class="btn o" data-a="catnew">${ic("plus",19)}Nova categoria</button></div>`],
 tema:["Aparência",()=>`<label class="lab">Tema</label>${segHTML("theme",[["auto","Automático"],["light","Claro"],["dark","Escuro"]],P.theme)}<label class="lab" style="margin-top:18px">Tamanho do texto</label>${segHTML("size",[["0.92","Pequeno"],["1","Padrão"],["1.1","Grande"]],P.size)}<label class="lab" style="margin-top:18px">Densidade das listas</label>${segHTML("dens",[["c","Confortável"],["k","Compacta"]],P.dens)}`],
 idioma:["Idioma",()=>[["Português (Brasil)",1],["English",0],["Español",0]].map(([n,on])=>`<div class="lr plain ${on?"":"mu"}"><span class="bd"><b>${n}</b></span>${on?`<span class="rad on">${ic("check",14)}</span>`:`<span class="soon">Em breve</span>`}</div>`).join("")],
 ajuda:["Ajuda e suporte",()=>[["Como o Assistence lê meus e-mails?","Depois que você autoriza o acesso, o app lê as mensagens recentes para identificar categoria, prazo, valor e a ação necessária. O login é feito na página do Google e o acesso é somente leitura: o Assistence não envia, apaga nem altera nada no Gmail."],["A análise errou. E agora?","Abra a mensagem e toque no lápis ao lado da informação errada, ou em Corrigir análise. Você pode criar uma regra para aquele remetente."],["Como adio uma mensagem?","Na mensagem, toque em Adiar e escolha quando ela deve voltar. Ela some da lista e fica em Adiadas."],["Quais contas posso conectar?","Hoje, o Gmail. Outlook e WhatsApp Business estão previstos. Em Contas conectadas você pode pedir aviso."]].map(([q,a],i)=>`<div class="faq"><button class="lr" data-a="faq" data-v="${i}" aria-expanded="${S.faq===i}"><span class="bd"><b>${q}</b></span><span class="mu" style="transform:rotate(${S.faq===i?90:0}deg)">${ic("chevR",18)}</span></button>${S.faq===i?`<p>${a}</p>`:""}</div>`).join("")+`<div class="stack" style="margin-top:18px"><button class="btn o" data-a="tour">${ic("sparkle",19)}Rever o tour</button><button class="btn o" data-a="feedback">${ic("send",19)}Enviar feedback</button></div>`],
 sobre:["Sobre o Assistence",()=>`<div class="big">${logo(64)}<b style="font-size:20px">Assistence</b><span class="mu">Versão 7 · algoritmo próprio${MODE3(" · plataforma com servidor"," · rodando dentro do Claude"," · conexão direta com o Google")}</span></div><div class="card"><h3>O que funciona de verdade</h3><p>${MODE3("Cadastro com a conta Google, autorização do Gmail e leitura pelo servidor do Assistence, que atualiza sozinho mesmo com o app fechado. Os seus ajustes valem em todos os aparelhos.","Leitura do Gmail pelo conector do Claude, que só entrega os e-mails (somente leitura).","Login com o Google e leitura direta do Gmail (somente leitura).")} Análise pelo algoritmo próprio do Assistence: categorias, prioridades, prazos, valores, ações, contatos frequentes e conversas sem resposta. Aprendizado com as suas correções, tarefas e regras.</p></div><div class="card" style="margin-top:12px"><h3>O que ainda não existe</h3><p>Enviar ou responder e-mails e arquivar ou apagar no Gmail (as ações do app valem só dentro dele). Também faltam notificações fora do app, leitura do conteúdo de anexos, sincronização entre aparelhos, Outlook e WhatsApp.</p></div>`]
};
function vPriv(){if(TR==="server")return vPrivServer();return `<div class="pg"><button class="back" data-a="back">${ic("chevL",24)}Configurações</button><div class="shield">${ic("shield",52)}</div><h1 class="tt" style="text-align:center">Privacidade</h1><p class="mu" style="text-align:center">O que o Assistence faz com as suas mensagens.</p>
<ul class="cl"><li>${ic("checkC",22)}<span>${TR==="claude"?"Dentro do Claude, o conector do Gmail só entrega os e-mails. Nenhuma IA os analisa":"Login pela página do próprio Google: o app nunca vê a sua senha"}</span></li><li>${ic("checkC",22)}<span>Somente leitura: nada é enviado, apagado ou alterado no Gmail</span></li><li>${ic("checkC",22)}<span>${TR==="gateway"?"A análise é feita pelo algoritmo do Assistence, no seu navegador, sem IA. As mensagens passam pela porta do Assistence no Cloudflare só para chegar a esta página; nada é guardado lá":"A análise é feita pelo algoritmo do Assistence, no seu navegador, sem servidor próprio e sem IA"}</span></li></ul>
<div class="card"><h3>O que é lido</h3><p>As conversas recentes da caixa de entrada. Para conhecer seus contatos, também lê os destinatários (não o texto) dos e-mails que você enviou nos últimos 6 meses. Os textos ficam só na memória desta página enquanto ela está aberta.${TR==="claude"?" Eles passam pela plataforma do Claude apenas para serem entregues a esta página.":TR==="gateway"?" A autorização do Google fica cifrada num cookie que esta página não consegue ler e vale por até 30 dias (7 dias enquanto o projeto do Google estiver em modo de teste).":" O acesso ao Google dura cerca de uma hora e não é gravado."}</p></div>
<div class="card" style="margin-top:12px"><h3>O que fica guardado neste navegador</h3><p>Nome e e-mail, preferências, regras, correções e exemplos aprendidos (com palavras-chave das mensagens corrigidas), contatos com contagem de e-mails, notas, tarefas e o estado de cada conversa no app. Nada vai para a nuvem. Em outro aparelho, o app começa do zero.</p></div>
<div class="card" style="margin-top:12px"><h3>O que esta versão não garante</h3><p>É uma primeira versão, sem auditoria de segurança. ${TR==="claude"?"Dentro do Claude, a página só funciona aberta e lê até 100 conversas por vez.":"Enquanto o projeto do Google estiver em modo de teste, só as contas cadastradas como usuárias de teste conseguem entrar."}</p></div>
<div class="stack" style="margin-top:18px"><button class="btn o" data-a="export">${ic("download",19)}Exportar meus dados</button>${S.confirmDel?`<p class="err" style="margin:0">Isso apaga tudo que o Assistence guardou neste navegador e encerra o acesso ao Gmail. Seus e-mails no Gmail não são afetados. Confirmar?</p><button class="btn dg" data-a="delyes">${ic("trash",19)}Sim, apagar tudo</button><button class="btn o" data-a="delno">Cancelar</button>`:`<button class="btn dg" data-a="delask">${ic("trash",19)}Apagar meus dados e desconectar</button>`}</div></div>`}
function vSet(k){if(k==="priv")return vPriv();if(k==="insights")return vInsights();const s=SET[k];return `<div class="pg"><button class="back" data-a="back">${ic("chevL",24)}${k==="categorias"||k==="regras"?"Voltar":"Configurações"}</button><h1 class="tt">${s[0]}</h1>${s[1]()}</div>`}
function vStack(t){const n=t.name;return n==="detail"?vDetail(t.id):n==="cat"?vCat(t.n):n==="search"?vSearch():n==="reply"?vReply(t.id):n==="notifs"?vNotifs():n==="insights"?vInsights():vSet(t.k)}

/* ---------- folhas (bottom sheets) ---------- */
function dueEditor(iso,hora){
  const q=[["","Sem prazo"],[D(0),"Hoje"],[D(1),"Amanhã"],[D(3),"Sexta"],[D(7),"Em 1 semana"]];
  return `<div class="chips" style="margin:6px 0 10px">${q.map(([v,t])=>`<button class="chip" data-a="setdue" data-v="${v}">${t}</button>`).join("")}</div>
<div style="display:flex;gap:10px"><div style="flex:1"><label class="lab" for="dd" style="margin-top:0">Data</label><input id="dd" class="in" type="date" value="${iso||""}"></div><div style="flex:1"><label class="lab" for="dh" style="margin-top:0">Hora (opcional)</label><input id="dh" class="in" type="time" value="${hora||""}"></div></div>`;
}
const btnrow=(a,b)=>`<div class="stack" style="margin-top:16px">${a}${b||""}</div>`;
function snoozeOpts(){
  const o=[["Mais tarde hoje",T(0,17,0)],["Amanhã de manhã",T(1,9,0)],["Segunda-feira",T(6,9,0)],["Daqui a 1 semana",T(7,9,0)]];
  return o.map(([t,ts])=>`<button class="lr" data-a="snoozego" data-v="${ts}"><span class="ic">${ic("clock",21)}</span><span class="bd"><b>${t}</b></span><span class="mu sm">${esc(fmtFull(ts).replace(/^\S+, /,""))}</span></button>`).join("");
}
function sheetHTML(){
  const s=S.sheet;if(!s)return "";let b="";
  const e=s.id?find(s.id):null;
  switch(s.type){
   case"perm":b=`<h3>Conectar o Gmail</h3><p class="mu sm">${TR==="claude"?"O Claude vai pedir a sua aprovação para esta página ler o Gmail pelo conector.":"Vai abrir uma janela do Google. Escolha a sua conta e permita a leitura."}</p>
     <div class="lr plain"><span class="tile">${ic("eye",20)}</span><span class="bd"><b>Ver suas mensagens de e-mail</b><small>Até ${maxT()} conversas recentes, somente leitura</small></span><span class="badge lo">Obrigatório</span></div>
     <div class="lr plain"><span class="tile">${ic("send",20)}</span><span class="bd"><b>Enviar respostas por você</b><small>Ainda não existe nesta versão</small></span><span class="soon">Em breve</span></div>
     <p class="note">${TR==="claude"?"O conector só entrega os e-mails. A análise é feita pelo algoritmo do Assistence, sem IA. O Assistence não envia, apaga nem altera e-mails.":"O Google pode avisar que o app não foi verificado. Em modo de teste isso é normal: toque em Continuar. O Assistence não envia, apaga nem altera e-mails."}</p>${btnrow(`<button class="btn" data-a="permok">Permitir e analisar</button>`,`<button class="btn o" data-a="closesheet">Cancelar</button>`)}`;break;
   case"cid":b=`<h3>ID do cliente do Google</h3><p class="mu sm">Cole o ID que termina em <b>.apps.googleusercontent.com</b>. Ele não é senha: só identifica o seu app no Google.</p><label class="lab" for="cidin">ID do cliente OAuth</label><input id="cidin" class="in" value="${esc(P.clientId||"")}" placeholder="123…-abc….apps.googleusercontent.com" autocomplete="off" autocapitalize="off" spellcheck="false" data-af><p class="note">Origem a autorizar no Google Cloud: <b style="overflow-wrap:anywhere">${esc(location.origin)}</b></p><div id="ciderr" class="err" hidden></div>${btnrow(`<button class="btn" data-a="savecid">Salvar</button>`,`<button class="btn o" data-a="cidhelp">Como criar (passo a passo)</button>`)}`;break;
   case"cidhelp":b=`<h3>Criar o acesso ao Google</h3><p class="mu sm">Grátis, feito uma vez, com a sua conta Google.</p><ol class="steps">
     <li>Abra <b>console.cloud.google.com</b> e crie um projeto (ex.: Assistence).</li>
     <li>Em <b>APIs e serviços › Biblioteca</b>, procure <b>Gmail API</b> e toque em <b>Ativar</b>.</li>
     <li>Abra <b>Google Auth Platform</b> (ou Tela de consentimento OAuth) e toque em <b>Começar</b>. Nome: Assistence. Público: <b>Externo</b>.</li>
     <li>Em <b>Público-alvo</b>, deixe em <b>Teste</b> e adicione o seu Gmail em <b>Usuários de teste</b>.</li>
     <li>Em <b>Acesso a dados</b>, adicione o escopo <b>…/auth/gmail.readonly</b>.</li>
     <li>Em <b>Clientes</b>, crie um cliente <b>Aplicativo da Web</b>. Em <b>Origens JavaScript autorizadas</b>, coloque: <b style="overflow-wrap:anywhere">${esc(location.origin)}</b></li>
     <li>Copie o <b>ID do cliente</b> e cole no Assistence.</li></ol>
     <p class="note">Não é preciso a "chave secreta do cliente". Nunca cole senhas no app.</p>${btnrow(`<button class="btn" data-a="cid">Já tenho o ID</button>`)}`;break;
   case"addmenu":b=`<h3>Adicionar</h3><div style="margin-top:6px"><button class="lr" data-a="paste"><span class="tile">${ic("mail",20)}</span><span class="bd"><b>Colar um e-mail</b><small>O Assistence analisa e coloca na lista</small></span></button><button class="lr" data-a="newtask"><span class="tile">${ic("tasks",20)}</span><span class="bd"><b>Nova tarefa</b><small>Algo que não veio de um e-mail</small></span></button></div>`;break;
   case"paste":b=`<h3>Colar um e-mail</h3><p class="mu sm">O texto é analisado aqui no navegador e fica só nesta sessão. Não é guardado.</p><label class="lab" for="cfrom">Remetente (opcional)</label><input id="cfrom" class="in" placeholder="Ex.: Cliente Lima" data-af><label class="lab" for="cbody">E-mail</label><textarea id="cbody" class="ta" placeholder="Cole aqui o texto do e-mail…"></textarea><div id="cerr" class="err" hidden></div>${btnrow(`<button class="btn" id="cgo" data-a="addmail">Analisar e adicionar</button>`)}`;break;
   case"filt":b=`<h3>Filtrar e ordenar</h3><label class="lab">Ordenar por</label>${segHTML("fsort",[["recent","Mais recentes"],["prio","Prioridade"]],S.sort)}<label class="lab" style="margin-top:16px">Categorias</label><div class="chips">${cats().map(c=>`<button class="chip ${S.fcats.includes(c.n)?"on":""}" data-a="fcat" data-v="${esc(c.n)}">${esc(c.n)}</button>`).join("")}</div>
     <div class="lr plain"><span class="bd"><b>Somente com prazo</b></span>${swHTML("fdue",S.onlyDue,"Somente com prazo","swl")}</div>${btnrow(`<button class="btn" data-a="filtok">Aplicar</button>`,`<button class="btn o" data-a="filtclear">Limpar filtros</button>`)}`;break;
   case"snooze":b=`<h3>Adiar mensagem</h3><p class="mu sm">Ela some da lista e volta no horário escolhido. Vale só no Assistence; o Gmail não muda.</p><div style="margin-top:6px">${snoozeOpts()}</div>${e.snooze&&e.snooze>NOW?`<button class="btn o" style="margin-top:12px" data-a="unsnooze" data-v="${e.id}">Trazer de volta agora</button>`:""}`;break;
   case"edit":{const a=e.a;
     if(s.f==="valor")b=`<h3>Valor</h3><label class="lab" for="ev">Valor identificado</label><input id="ev" class="in" value="${esc(a.valor||"")}" placeholder="R$ 0,00" data-af>${btnrow(`<button class="btn" data-a="saveedit" data-v="valor" data-id="${e.id}">Salvar</button>`)}`;
     if(s.f==="acao")b=`<h3>Ação sugerida</h3><p class="mu sm">Vira uma tarefa. Deixe em branco se não houver ação.</p><label class="lab" for="ea">Ação</label><input id="ea" class="in" value="${esc(a.acao||"")}" placeholder="Ex.: Enviar orçamento" data-af>${btnrow(`<button class="btn" data-a="saveedit" data-v="acao" data-id="${e.id}">Salvar</button>`)}`;
     if(s.f==="prazo")b=`<h3>Prazo</h3>${dueEditor(a.prazoData,a.prazoHora)}${btnrow(`<button class="btn" data-a="saveedit" data-v="prazo" data-id="${e.id}">Salvar</button>`)}`;
     if(s.f==="fix")b=`<h3>Corrigir análise</h3><p class="mu sm">Sua correção vira exemplo para as próximas análises.</p><label class="lab" for="fcat">Categoria</label><select id="fcat" class="in">${cats().map(c=>`<option ${c.n===a.categoria?"selected":""}>${esc(c.n)}</option>`).join("")}</select><label class="lab">Prioridade</label>${segHTML("fpri",[["alta","Alta"],["média","Média"],["baixa","Baixa"]],a.prioridade)}
       <div class="lr plain"><span class="bd"><b>Sempre aplicar a ${esc(e.from)}</b><small>Cria uma regra para este remetente</small></span>${swHTML("frule",false,"Criar regra para o remetente")}</div>${btnrow(`<button class="btn" data-a="savefix" data-id="${e.id}">Salvar correção</button>`)}`;
     break}
   case"more":b=`<h3>Mais ações</h3><div style="margin-top:6px"><button class="lr" data-a="edit" data-v="fix" data-id="${e.id}"><span class="ic">${ic("edit",21)}</span><span class="bd"><b>Corrigir análise</b></span></button><button class="lr" data-a="unread" data-v="${e.id}"><span class="ic">${ic("openm",21)}</span><span class="bd"><b>${e.unread?"Marcar como lida":"Marcar como não lida"}</b></span></button><button class="lr" data-a="mute" data-v="${e.id}"><span class="ic">${ic("mute",21)}</span><span class="bd"><b>${e.a.muted?"Parar de silenciar remetente":"Silenciar remetente"}</b><small>Mensagens de ${esc(e.from)} ficam com prioridade baixa</small></span></button><button class="lr" data-a="copysubj" data-v="${e.id}"><span class="ic">${ic("copy",21)}</span><span class="bd"><b>Copiar assunto</b></span></button></div>`;break;
   case"sender":{const l=S.emails.filter(m=>m.addr===e.addr),ru=RULES.find(r=>r.addr===e.addr);
     b=`<div class="big">${avatar(e.name,"av",64)}<b style="font-size:19px">${esc(e.name)}</b><span class="mu">${esc(e.addr)}</span><span class="badge ${pcl(e.a.prioridade)}">${esc(e.a.categoria)}</span></div>
     <div class="lr plain"><span class="bd"><b>${l.length} ${l.length===1?"mensagem":"mensagens"}</b><small>${l.filter(m=>!m.done&&m.a.acao).length} com ação pendente</small></span></div>
     <button class="lr" data-a="newrule" data-v="${e.id}"><span class="ic">${ic("rule",21)}</span><span class="bd"><b>${ru?"Editar regra":"Criar regra para este remetente"}</b><small>${ru?"Já existe uma regra":"Sempre classificar de um jeito"}</small></span></button>
     <button class="lr" data-a="mute" data-v="${e.id}"><span class="ic">${ic("mute",21)}</span><span class="bd"><b>${e.a.muted?"Parar de silenciar":"Silenciar remetente"}</b></span></button>
     <button class="lr" data-a="seesender" data-v="${esc(e.addr)}"><span class="ic">${ic("search",21)}</span><span class="bd"><b>Ver todas as mensagens</b></span></button>`;break}
   case"attach":{const x=e.att[s.i];b=`<div class="big"><span class="tile" style="width:56px;height:56px;border-radius:16px">${ic("file",28)}</span><b style="overflow-wrap:anywhere">${esc(x.n)}</b><span class="mu">${esc(x.size)}</span></div><p class="note">O Assistence ainda não lê o conteúdo dos anexos. Abra a conversa no Gmail para ver o arquivo.</p>${btnrow(`<button class="btn" data-a="attask" data-id="${e.id}" data-v="${s.i}">${ic("plus",19)}Criar tarefa para revisar</button>`,`<button class="btn o" data-a="copyname" data-id="${e.id}" data-v="${s.i}">${ic("copy",19)}Copiar nome do arquivo</button>`)}`;break}
   case"task":{const t=s.tid?tasks().find(x=>x.id===s.tid):null;

/* ---------- Google: login e API do Gmail (somente leitura) ----------
   O login acontece numa janela do próprio Google. O token de acesso fica só
   na memória desta página (dura cerca de 1 hora) e nunca é gravado. */
const GSCOPE="https://www.googleapis.com/auth/gmail.readonly";
const GAPI="https://gmail.googleapis.com/gmail/v1/users/me";
const GM={self:"",tok:null,exp:0,client:null,pend:null,THREADS:new Map()};
const maxT=()=>Math.min(TR==="claude"?100:300,Math.max(20,+P.maxt||100));
const clientId=()=>String(CFG_CLIENT_ID||P.clientId||"").trim();
const CID_RX=/^\d+-[a-z0-9]+\.apps\.googleusercontent\.com$/;
const gerr=(code,msg)=>{const x=new Error(msg||code);x.code=code;return x};
function loadGis(){
  return new Promise((res,rej)=>{
    const ok=()=>window.google&&google.accounts&&google.accounts.oauth2;
    if(ok())return res();
    let s=document.querySelector("script[data-gis]");
    if(!s){s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.async=true;s.defer=true;s.setAttribute("data-gis","1");document.head.appendChild(s)}
    s.addEventListener("error",()=>rej(gerr("gis_load")));
    const t0=Date.now(),iv=setInterval(()=>{if(ok()){clearInterval(iv);res()}else if(Date.now()-t0>15000){clearInterval(iv);rej(gerr("gis_load"))}},100);
  });
}
let gisP=null;
function prepGoogle(){
  if(!clientId())return Promise.reject(gerr("no_client"));
  if(GM.client&&GM.cid===clientId())return Promise.resolve();
  gisP=loadGis().then(()=>{
    GM.client=google.accounts.oauth2.initTokenClient({
      client_id:clientId(),scope:GSCOPE,
      callback:r=>{const p=GM.pend;GM.pend=null;if(!p)return;
        if(r.error)return p.rej(gerr(r.error));
        if(!google.accounts.oauth2.hasGrantedAllScopes(r,GSCOPE))return p.rej(gerr("scope_denied"));
        GM.tok=r.access_token;GM.exp=Date.now()+((+r.expires_in||3600)-90)*1000;p.res(GM.tok)},
      error_callback:e=>{const p=GM.pend;GM.pend=null;if(p)p.rej(gerr((e&&e.type)||"popup_closed"))}
    });
    GM.cid=clientId();
  });
  gisP.catch(()=>{gisP=null});
  return gisP;
}
const hasToken=()=>TR==="claude"||TR==="server"||(TR==="gateway"?!!(PORTA.me&&PORTA.me.gmail==="ok"):(!!GM.tok&&Date.now()<GM.exp));
/* precisa ser chamada direto no toque do usuário, antes de qualquer await */
function ensureToken(interactive){
  if(TR==="claude"||TR==="server")return Promise.resolve(TR);
  if(TR==="gateway")return PORTA.me?(PORTA.me.gmail==="ok"?Promise.resolve(TR):Promise.reject(gerr("needs_gmail"))):Promise.reject(gerr("needs_login"));
  if(hasToken())return Promise.resolve(GM.tok);
  if(!interactive)return Promise.reject(gerr("needs_login"));
  if(!clientId())return Promise.reject(gerr("no_client"));
  if(!GM.client){prepGoogle().catch(()=>{});return Promise.reject(gerr("gis_not_ready"))}
  return new Promise((res,rej)=>{
    GM.pend={res,rej};
    try{const o={prompt:P.connected?"":"consent"};if(PROFILE.email)o.login_hint=PROFILE.email;GM.client.requestAccessToken(o)}
    catch(e){GM.pend=null;rej(gerr("popup_failed_to_open"))}
  });
}
async function gget(path,params){
  if(TR==="gateway")return pget(path,params);
  if(!hasToken())throw gerr("needs_login");
  const u=new URL(GAPI+path);
  Object.entries(params||{}).forEach(([k,v])=>{if(Array.isArray(v))v.forEach(x=>u.searchParams.append(k,x));else if(v!=null&&v!=="")u.searchParams.set(k,v)});
  for(let i=0;i<4;i++){
    let r;
    try{r=await fetch(u.toString(),{headers:{Authorization:"Bearer "+GM.tok}})}
    catch(e){if(i<2){await wait(800*(i+1));continue}throw gerr("network")}
    if(r.ok)return r.json();
    if(r.status===401){GM.tok=null;throw gerr("needs_login")}
    let j={};try{j=await r.json()}catch(e){}
    const txt=JSON.stringify(j);
    if(r.status===403&&/accessNotConfigured|SERVICE_DISABLED|has not been used/i.test(txt))throw gerr("api_disabled");
    if((r.status===429||r.status>=500||/rateLimit/i.test(txt))&&i<3){await wait(1500*(i+1));continue}
    throw gerr(r.status===403?"forbidden":"http_"+r.status);
  }
  throw gerr("network");
}

    access_denied:"Você não autorizou o acesso. Toque de novo e permita a leitura do Gmail.",
    scope_denied:"Falta a permissão de leitura do Gmail. Toque de novo e marque a caixa “Ver suas mensagens de e-mail”.",

}
async function pool(items,n,fn,onProg){

  const from=$("#cfrom").value.trim()||"Você (colado)",slug=norm(from).replace(/[^a-z0-9]+/g,"")||"colado";
  const s={id:"u"+Date.now(),from,name:from,addr:slug+"@colado.local",subject:body.split("\n")[0].slice(0,56),unread:true,star:false,ts:Date.now(),att:[],core:"",labels:[],sig:{},nmsg:1,url:"",pasted:true,thread:[{who:"them",ts:Date.now(),body,clean:Eng.stripQuoted(body)}]};
  s.fb=Eng.analyze(s,ctxNow());
  const e=mk(s);e.pasted=true;S.emails.unshift(e);S.sheet=null;r(true);toast("E-mail analisado e adicionado (só nesta sessão).");
}
function reanalyze(){
  S.emails.forEach(analyzeLocal);r(true);
  openSheet({type:"msg",icon:"checkC",title:"Análise atualizada",text:`${S.emails.length} ${S.emails.length===1?"conversa foi reanalisada":"conversas foram reanalisadas"} com as suas preferências, regras e ${EXAMPLES.length} ${EXAMPLES.length===1?"exemplo aprendido":"exemplos aprendidos"}.`});
}

document.addEventListener("keydown",ev=>{
  if((ev.key==="Enter"||ev.key===" ")&&ev.target.matches('[role="button"][tabindex]')){ev.preventDefault();ev.target.click();return}
  if(ev.key==="Enter"&&ev.target.id==="sq")addRecent(ev.target.value);
  if(ev.key==="Escape"&&S.sheet&&S.sheet.type!=="busy")closeSheet();
  /* computador: atalhos da mesa de trabalho */
  if(DESK&&S.stage==="app"&&!S.sheet&&!/^(INPUT|TEXTAREA|SELECT)$/.test((ev.target.tagName||""))&&!ev.metaKey&&!ev.ctrlKey&&!ev.altKey){
    if(ev.key==="/"){ev.preventDefault();const b=document.querySelector('.dsearch');b&&b.click();return}
    if(S.tab==="msgs"&&!S.stack.length&&!S.sel&&(ev.key==="ArrowDown"||ev.key==="ArrowUp"||ev.key==="j"||ev.key==="k")){ev.preventDefault();deskNav(ev.key==="ArrowDown"||ev.key==="j"?1:-1);return}
    if(ev.key==="Escape"&&S.stack.length){S.stack.pop();r(true);return}
    if(ev.key==="Escape"&&S.dsel){S.dsel=null;r(true)}
  }
});

  r();
  detectTransport().then(async t=>{
    if(t==="claude"){if(P.connected&&S.stage==="splash")startProc(true);else r(true);return}
    if(await detectServer()){
      if(TR==="gateway")return bootPorta();
      const q=new URLSearchParams(location.search),erro=q.get("erro"),entrou=q.get("entrou");
      if(erro||entrou)history.replaceState(null,"",location.pathname);
      if(erro){S.connErr=ERRO_URL[erro]||ERRO_URL.google;S.stage="connect"}
      if(SRV.me){
        ownLocal(SRV.me.email);
        try{await loadServerState()}catch(e){}
        applyTheme();
        if(SRV.me.gmail==="ok")return startProc(!entrou);
        S.stage="connect";
      }
      return r();
    }
    if(clientId())prepGoogle().catch(()=>{});
    if(P.connected&&S.stage==="splash"){S.stage="connect";r()}
  });
})();

</script>

<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistence Demonstração</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: um celular único (moldura no desktop, tela cheia no telefone). Telas empilhadas, barra de abas fixa no rodapé. */
:root{
  --bg:#e8ebf6; --app:#ffffff; --sf:#ffffff; --sf2:#f2f4fa; --tx:#0e1530; --mu:#656e8d; --bd:#e4e7f1;
  --ac:#4f46e5; --acs:#eceeff;
  --grad:linear-gradient(100deg,#3b8cff 0%,#4f46e5 100%);
  --hi:#e5383b; --hi-s:#fdebec; --me:#e08a00; --me-s:#fff3dc; --lo:#1b9a5f; --lo-s:#e2f5eb;
  --sh:0 1px 2px rgba(14,21,48,.05),0 8px 20px rgba(14,21,48,.06);
  --avbg:93%; --avfg:34%;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#04060d; --app:#0b1020; --sf:#141a33; --sf2:#1a2142; --tx:#eef1ff; --mu:#98a1c5; --bd:#252d50;
  --ac:#8b93ff; --acs:#1f2552; --hi:#ff6b6e; --hi-s:#3b1d29; --me:#fbbf24; --me-s:#3a3018; --lo:#4ade9b; --lo-s:#143428;
  --sh:0 1px 2px rgba(0,0,0,.45); --avbg:22%; --avfg:80%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#04060d; --app:#0b1020; --sf:#141a33; --sf2:#1a2142; --tx:#eef1ff; --mu:#98a1c5; --bd:#252d50;
  --ac:#8b93ff; --acs:#1f2552; --hi:#ff6b6e; --hi-s:#3b1d29; --me:#fbbf24; --me-s:#3a3018; --lo:#4ade9b; --lo-s:#143428;
  --sh:0 1px 2px rgba(0,0,0,.45); --avbg:22%; --avfg:80%; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px;line-height:1.4;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:10px}
.mu{color:var(--mu)} .sm{font-size:13px}

#device{position:relative;width:100%;height:100%;overflow:hidden;background:var(--app)}
@media (min-width:520px) and (min-height:720px){
  #device{width:392px;height:min(100%,812px);border-radius:46px;border:9px solid #0a0f20;box-shadow:0 30px 80px rgba(10,15,32,.35),0 0 0 1px rgba(255,255,255,.08)}
}
#screen{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
#screen::-webkit-scrollbar{display:none}
.pg{min-height:100%;padding:22px 20px 28px;display:flex;flex-direction:column}
.hasTab .pg{padding-bottom:98px}

/* cabeçalhos */
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;flex:none}
.icbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.icbtn:hover{background:var(--sf2)}
h1.t{font-size:30px;font-weight:800;letter-spacing:-.025em}
.greet{font-size:25px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 12px}
h2.s{font-size:19px;font-weight:700;letter-spacing:-.01em}
.link{color:var(--ac);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:2px}
.back{display:flex;align-items:center;gap:4px;margin:-6px 0 14px -8px;height:40px;padding:0 8px;border-radius:12px;font-weight:600;color:var(--tx);align-self:flex-start}
h1.tt{font-size:28px;font-weight:800;letter-spacing:-.025em;margin-bottom:6px;text-wrap:balance}

/* início */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 24px}
.stat{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:12px;box-shadow:var(--sh)}
.stat b{display:block;font-size:27px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ac)}
.stat.red b{color:var(--hi)}
.stat span{display:block;margin-top:5px;font-size:12px;line-height:1.25;color:var(--mu)}
.pc{display:grid;grid-template-columns:auto 1fr auto;column-gap:12px;row-gap:2px;width:100%;background:var(--sf);border:1px solid var(--bd);border-left:4px solid var(--bd);border-radius:16px;padding:13px 14px;margin-bottom:11px;box-shadow:var(--sh);cursor:pointer;text-align:left}
.pc.hi,.mr.hi{border-left-color:var(--hi)} .pc.me,.mr.me{border-left-color:var(--me)} .pc.lo,.mr.lo{border-left-color:var(--lo)}
.pc .ico{grid-row:1/4;padding-top:1px}
.pc.hi .ico{color:var(--hi)} .pc.me .ico{color:var(--me)} .pc.lo .ico{color:var(--lo)}
.pc .nm{font-weight:700;font-size:16px;min-width:0;overflow-wrap:anywhere}
.pc .sb{color:var(--mu);font-size:14px;min-width:0;overflow-wrap:anywhere}
.pc .tm{font-size:13px;color:var(--mu);text-align:right;font-variant-numeric:tabular-nums}
.due{font-size:13px;font-weight:600;color:var(--mu)} .due.now{color:var(--hi)}
.pc .act{grid-column:3;grid-row:3;justify-self:end;align-self:end;display:grid;place-items:center;width:28px;height:28px;margin:-4px -4px -6px 0;border-radius:50%}
.pc .act.star{color:var(--hi)}
.circ{width:20px;height:20px;border-radius:50%;border:2px solid var(--mu);display:block}
.hs{display:flex;gap:10px;overflow-x:auto;margin:0 -20px;padding:2px 20px 8px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.ct{flex:0 0 auto;min-width:104px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;display:grid;gap:6px;justify-items:start;box-shadow:var(--sh)}
.ct .ci{color:var(--ac)} .ct span{font-size:13px;font-weight:500} .ct b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}

/* mensagens */
.chips{display:flex;gap:8px;margin:2px 0 14px;flex-wrap:wrap}
.chip{padding:8px 16px;border-radius:999px;background:var(--sf2);font-size:14px;font-weight:600}
.chip.on{background:var(--tx);color:var(--app)}
.sbar{display:flex;gap:10px;align-items:center;width:100%;background:var(--sf2);border-radius:14px;padding:13px 14px;color:var(--mu);margin-bottom:8px}
.mr{display:flex;align-items:center;gap:12px;width:100%;padding:13px 4px 13px 10px;border-bottom:1px solid var(--bd);border-left:3px solid transparent;cursor:pointer;text-align:left}
.mr .tile{width:38px;height:38px}
.mr .bd{flex:1;min-width:0}
.mr .nm{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:16px}
.mr.unread .nm b::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac);margin-left:8px;vertical-align:1px}
.mr .nm span{font-weight:400;font-size:13px;color:var(--mu);white-space:nowrap;font-variant-numeric:tabular-nums}
.mr .sb{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mu);font-size:14px}
.mr .sb span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr .st{color:#f5a300;flex:none}
.tile{width:40px;height:40px;border-radius:12px;background:var(--acs);color:var(--ac);display:grid;place-items:center;flex:none}
.empty{text-align:center;color:var(--mu);padding:36px 12px;font-size:14px}

/* tarefas */
.tabs{display:flex;border-bottom:1px solid var(--bd);margin:12px 0 4px}
.tabs button{flex:1;text-align:center;padding:12px 0;font-weight:600;color:var(--mu);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac)}
.tk{display:flex;align-items:center;gap:14px;width:100%;padding:16px 2px;border-bottom:1px solid var(--bd);cursor:pointer;text-align:left}
.tk .bd{flex:1;min-width:0}
.tk b{display:block;font-size:16px;font-weight:600}
.tk .sb{font-size:13px;color:var(--mu)}
.ck{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--me);display:grid;place-items:center;flex:none;color:#fff}
.ck.hi{border-color:var(--hi)} .ck.lo{border-color:var(--lo)}
.ck.done{background:var(--lo);border-color:var(--lo)}
.tk.isdone b{text-decoration:line-through;color:var(--mu)}

/* listas e configurações */
.lr{display:flex;align-items:center;gap:14px;width:100%;padding:15px 2px;border-bottom:1px solid var(--bd);cursor:pointer;text-align:left}
.lr .bd{flex:1;min-width:0}
.lr b{display:block;font-size:16px;font-weight:600}
.lr small{display:block;color:var(--mu);font-size:13px}
.lr .ic{color:var(--tx);flex:none}
.lr.plain{cursor:default}
.dng{color:var(--hi)} .dng .ic{color:var(--hi)}
.sw{width:48px;height:28px;border-radius:999px;background:var(--bd);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--ac)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.rad{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;flex:none;color:#fff}
.rad.on{background:var(--ac);border-color:var(--ac)}
.note{font-size:13px;color:var(--mu);margin-top:14px}
.faq p{padding:0 2px 14px;color:var(--mu);font-size:14px}

/* botões */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:16px;padding:15px 18px;font-weight:700;font-size:16px;background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(79,70,229,.28);text-align:center}
.btn.o{background:var(--sf);color:var(--tx);border:1px solid var(--bd);box-shadow:none;font-weight:600}
.btn.ok{background:var(--lo-s);color:var(--lo);box-shadow:none}
.btn.dg{background:var(--hi-s);color:var(--hi);box-shadow:none}
.btn:disabled{opacity:.6;cursor:default}
[hidden]{display:none!important}
.steps{margin:12px 0 0;padding-left:20px;display:grid;gap:9px;font-size:14px;line-height:1.45;color:var(--tx)}
a.btn{text-decoration:none}
a.pill{text-decoration:none;display:inline-flex;align-items:center}
.stack{display:grid;gap:10px}
.pill{border-radius:12px;padding:9px 16px;font-weight:700;font-size:14px;background:var(--grad);color:#fff;flex:none}
.pill.g{background:var(--sf2);color:var(--tx)}
.pill:disabled{opacity:.7}

/* abertura / cadastro / conexão */
.splash{justify-content:space-between;align-items:stretch;text-align:center;padding-top:44px}
.splash .mid{display:grid;justify-items:center;gap:10px}
.splash h1{font-size:36px;font-weight:800;letter-spacing:-.03em;margin-top:12px}
.splash .tag{font-size:17px;color:var(--mu);max-width:260px;text-wrap:balance}
.feat{display:grid;gap:14px;margin:30px 0 0;justify-self:start;text-align:left}
.feat div{display:flex;align-items:center;gap:14px;font-weight:500}
.feat .tile{width:38px;height:38px;border-radius:50%}
.foot{text-align:center;margin-top:14px;font-size:15px}
.foot button{color:var(--ac);font-weight:700}
.auth{display:grid;gap:12px;margin-top:26px}
.auth .btn{padding:16px}
.auth .gg{font-weight:800;color:#4285f4;font-size:18px;line-height:1}
.legal{margin-top:auto;padding-top:24px;font-size:13px;color:var(--mu)}
.legal b{color:var(--ac);font-weight:500}
.acc{display:flex;align-items:center;gap:14px;background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.acc.off{background:var(--sf2);box-shadow:none;border-color:transparent;color:var(--mu)}
.acc .bd{flex:1;min-width:0}
.acc b{display:block;font-size:17px;font-weight:700} .acc small{font-size:13px;color:var(--mu)}
.acc .soon,.soon{font-size:13px}
.sec-ok{display:grid;gap:10px;margin-top:auto;padding-top:28px}
.sec-ok div{display:flex;gap:10px;align-items:center;color:var(--mu);font-size:15px}
.sec-ok svg{color:var(--lo)}

/* processamento (sempre escuro, como no app) */
.dk{background:#0a0f20;color:#fff}
.dk h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:34px 0 28px}
.gm{width:72px;height:72px;border-radius:20px;background:#fff;display:grid;place-items:center;color:#ea4335;margin:0 auto 30px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(59,140,255,.5)}50%{box-shadow:0 0 0 14px rgba(59,140,255,0)}}
.stp{display:flex;align-items:center;gap:14px;padding:9px 0;font-size:16px;color:rgba(255,255,255,.38)}
.stp .dot{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none;color:#fff}
.stp.done{color:#fff} .stp.done .dot{background:#3b8cff}
.stp.cur{color:#fff} .stp.cur .dot{background:transparent;border:2.5px solid rgba(255,255,255,.25);border-top-color:#3b8cff;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.12);margin:26px 0 16px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .5s}
.dk .hint{color:rgba(255,255,255,.62);font-size:14px}
.dk .hint button{color:#8fb8ff;font-weight:600;text-decoration:underline}

/* detalhe */
.dh{display:flex;align-items:center;justify-content:space-between;margin:-6px -8px 10px}
.dh .r{display:flex}
.who{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.av{width:48px;height:48px;border-radius:50%;background:var(--acs);color:var(--ac);font-weight:700;font-size:19px;display:grid;place-items:center;flex:none}
.who b{display:block;font-size:19px;font-weight:700} .who span span{color:var(--mu);font-size:14px;overflow-wrap:anywhere}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;color:var(--mu);font-size:14px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.badge.hi{background:var(--hi-s);color:var(--hi)} .badge.me{background:var(--me-s);color:var(--me)} .badge.lo{background:var(--lo-s);color:var(--lo)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;box-shadow:var(--sh)}
.card h3{font-size:15px;font-weight:700;margin-bottom:4px}
.card p{color:var(--mu);font-size:15px}
.ir{display:flex;gap:14px;align-items:flex-start;padding:10px 0;font-size:15px}
.ir svg{flex:none;margin-top:1px}
.ir .mu{margin-right:5px}
.meter{display:inline-flex;gap:3px;vertical-align:2px;margin-left:8px}
.meter i{width:16px;height:6px;border-radius:3px;background:var(--bd)} .meter i.on{background:var(--lo)}
.meter.me i.on{background:var(--me)} .meter.hi i.on{background:var(--hi)}
.orig{white-space:pre-wrap;font-size:14.5px;color:var(--tx)!important;line-height:1.55}
.in,.ta{width:100%;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);border-radius:12px;padding:12px 14px;font-size:15px}
.ta{min-height:130px;resize:vertical;line-height:1.5}
.lab{display:block;font-size:13px;font-weight:600;color:var(--mu);margin:12px 0 6px}
.err{color:var(--hi);font-size:13px;margin-top:8px}

/* segurança */
.shield{width:96px;height:96px;margin:10px auto 16px;border-radius:30px;background:var(--lo-s);color:var(--lo);display:grid;place-items:center}
.cl{display:grid;gap:2px;margin:18px 0}
.cl li{display:flex;gap:12px;align-items:flex-start;padding:9px 0}
.cl svg{color:var(--lo);flex:none;margin-top:1px}

/* abas, folha, aviso */
.tb{position:absolute;left:0;right:0;bottom:0;z-index:10;background:var(--sf);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 4px 10px}
.tb button{position:relative;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--mu);padding:5px 0;text-align:center}
.tb button.on{color:var(--ac)}
.bdg{position:absolute;top:0;left:calc(50% + 6px);background:var(--hi);color:#fff;border-radius:999px;font-size:10px;font-weight:700;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
.sbg{position:absolute;inset:0;background:rgba(8,12,28,.52);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--app);border-radius:26px 26px 0 0;padding:10px 20px 26px;max-height:88%;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--bd);margin:0 auto 14px}
.sheet h3{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
#toast{position:absolute;left:20px;right:20px;bottom:96px;z-index:30;background:var(--tx);color:var(--app);border-radius:14px;padding:12px 16px;font-size:14px;font-weight:600;text-align:center;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:none}
.sp{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.btn.o .sp{border-color:var(--bd);border-top-color:var(--ac)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v3 */
.pg{zoom:var(--z,1)}
.compact .mr{padding-top:9px;padding-bottom:9px}.compact .tk,.compact .lr{padding-top:11px;padding-bottom:11px}
.icbtn{position:relative}
.dot{position:absolute;top:7px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--hi);border:2px solid var(--app)}
.av2{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;background:hsl(var(--h) 75% var(--avbg));color:hsl(var(--h) 60% var(--avfg))}
.seg{display:flex;background:var(--sf2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;text-align:center;padding:9px 6px;border-radius:10px;font-size:14px;font-weight:600;color:var(--mu)}
.seg button.on{background:var(--sf);color:var(--tx);box-shadow:var(--sh)}
.gh{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:18px 0 4px}
.chips.sc{flex-wrap:nowrap;overflow-x:auto;margin:2px -20px 12px;padding:0 20px;scrollbar-width:none}
.chips.sc::-webkit-scrollbar{display:none}.chips.sc .chip{flex:none}
.hdr{display:flex;gap:2px}
.spin{animation:spin .9s linear infinite}
.brief{background:var(--grad);color:#fff;border-radius:18px;padding:16px;margin-bottom:22px;box-shadow:0 10px 24px rgba(79,70,229,.25)}
.brief h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;opacity:.95}
.brief p{margin:8px 0 12px;font-size:15px;line-height:1.5}
.brief .bt{background:rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.stat{text-align:left;display:block}
.dl{display:flex;align-items:center;gap:12px;width:100%;padding:11px 2px;border-bottom:1px solid var(--bd);text-align:left;cursor:pointer}
.dl .dd{width:46px;text-align:center;border-radius:12px;background:var(--sf2);padding:6px 0;flex:none}
.dl .dd b{display:block;font-size:17px;line-height:1.1}.dl .dd span{font-size:11px;color:var(--mu);text-transform:uppercase}
.dl .bd{flex:1;min-width:0}.dl .bd b{display:block;font-size:15px}.dl .bd span{font-size:13px;color:var(--mu)}
.mr .sj{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr.unread .sj{font-weight:700}
.mr .sn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr .sb .ix{display:flex;gap:6px;flex:none;align-items:center}
.mr.picked{background:var(--acs)}
.mr mark,.lr mark{background:#ffe27a;color:#222;border-radius:3px;padding:0 1px}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;flex:none;color:#fff;margin:0 7px}
.chk.on{background:var(--ac);border-color:var(--ac)}
.selbar{position:absolute;left:0;right:0;bottom:0;z-index:12;background:var(--sf);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 4px 10px}
.selbar button{display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;padding:5px 0;color:var(--tx)}
.skel{height:64px;border-radius:14px;background:linear-gradient(90deg,var(--sf2),var(--bd),var(--sf2));background-size:200% 100%;animation:sk 1.2s linear infinite;margin:10px 0}
@keyframes sk{to{background-position:-200% 0}}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.qa a{color:inherit;text-decoration:none}
.qa button,.qa a{display:grid;justify-items:center;gap:6px;padding:12px 4px;border-radius:16px;background:var(--sf2);font-size:12px;font-weight:600}
.qa svg{color:var(--ac)}
.ir .ed{margin-left:auto;color:var(--mu);width:32px;height:32px;display:grid;place-items:center;border-radius:10px;flex:none}
.ir .ed:hover{background:var(--sf2)}
.ir>span{flex:1;min-width:0}
.msg{border:1px solid var(--bd);border-radius:16px;padding:12px 14px;background:var(--sf);margin-bottom:10px}
.msg.me{background:var(--acs);border-color:transparent}
.msg .mh{display:flex;gap:10px;align-items:center;cursor:pointer;width:100%;text-align:left}
.msg .mh b{display:block;font-size:14.5px}.msg .mh small{color:var(--mu);font-size:12.5px}
.msg .mb{white-space:pre-wrap;font-size:14.5px;line-height:1.55;margin-top:10px}
.msg .mm{font-size:12.5px;color:var(--mu);margin-top:8px}
.att{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:14px;padding:10px 12px;background:var(--sf);width:100%;text-align:left;margin-top:8px}
.att small{display:block;color:var(--mu);font-size:12.5px}.att .bd{flex:1;min-width:0}.att b{font-size:14px;overflow-wrap:anywhere}
.why{margin-top:6px}.why li{display:flex;gap:8px;font-size:14px;padding:5px 0;color:var(--mu)}.why svg{color:var(--lo);flex:none;margin-top:2px}
.fbk{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-top:12px;font-size:14px;color:var(--mu)}
.fbk .r{display:flex;gap:6px}.fbk button{width:40px;height:40px;border-radius:12px;background:var(--sf2);display:grid;place-items:center;color:var(--tx)}
.fbk button.on{background:var(--acs);color:var(--ac)}
.bars{display:flex;align-items:flex-end;gap:10px;height:132px;margin-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bars i{display:block;width:100%;max-width:30px;border-radius:8px 8px 4px 4px;background:var(--ac);min-height:4px}
.bars span{font-size:11px;color:var(--mu)}.bars em{font-style:normal;font-size:12px;font-weight:700}
.hb{display:grid;grid-template-columns:96px 1fr 26px;gap:10px;align-items:center;font-size:13px;margin:9px 0}
.hb .tr{height:10px;border-radius:6px;background:var(--sf2)}.hb .tr i{display:block;height:100%;border-radius:6px;background:var(--ac)}
.hb b{text-align:right;font-variant-numeric:tabular-nums}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 18px}
.nt{display:flex;gap:12px;width:100%;padding:14px 2px;border-bottom:1px solid var(--bd);text-align:left;cursor:pointer;align-items:flex-start}
.nt.unr .t1{font-weight:700}.nt .bd{flex:1;min-width:0}.nt .t1{display:block;font-size:15px}.nt .t2{display:block;font-size:13.5px;color:var(--mu)}
.nt .t3{font-size:12px;color:var(--mu)}
.nt .pt{width:9px;height:9px;border-radius:50%;background:var(--ac);margin-top:7px;flex:none}
.rp{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;font-size:14px;margin-bottom:10px}
.rp .l{color:var(--mu)}
.rp .v{overflow-wrap:anywhere}
.quote{border-left:3px solid var(--bd);padding-left:12px;color:var(--mu);font-size:13.5px;white-space:pre-wrap;margin-top:10px}
.ib{display:flex;gap:8px;flex-wrap:wrap}
.icp{width:44px;height:44px;border-radius:12px;background:var(--sf2);display:grid;place-items:center;color:var(--mu)}
.icp.on{background:var(--acs);color:var(--ac);outline:2px solid var(--ac)}
.prof{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:18px;background:var(--sf);border:1px solid var(--bd);box-shadow:var(--sh);margin-bottom:6px;text-align:left}
.prof .av{width:54px;height:54px}
.prof b{display:block;font-size:18px}.prof small{color:var(--mu);font-size:13.5px}
.dev{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}
.dev .bd{flex:1}.dev b{display:block;font-size:15px}.dev small{color:var(--mu);font-size:13px}
.tourdots{display:flex;gap:6px;justify-content:center;margin:14px 0}.tourdots i{width:7px;height:7px;border-radius:50%;background:var(--bd)}.tourdots i.on{background:var(--ac)}
.big{display:grid;justify-items:center;text-align:center;gap:10px;padding:10px 0}
.tkgrp{margin-top:4px}
.ring{display:flex;align-items:center;gap:14px;margin:10px 0 2px}
.ring b{font-size:17px;display:block}.ring span{font-size:13.5px;color:var(--mu)}
#toast{display:flex;align-items:center;justify-content:center;gap:14px}
#toast.act{pointer-events:auto}
#toast button{color:#8fb8ff;font-weight:700}
:root[data-theme="light"] #toast button,:root:not([data-theme="dark"]) #toast button{color:#4f46e5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #toast button{color:#4f46e5}}
:root[data-theme="dark"] #toast button{color:#4f46e5}

/* ===== computador (≥ 1024 px): mesa de trabalho. O celular continua igual (tudo abaixo só vale com body.desk) ===== */
:root{--dbg:#f3f5fa;--dside:#ffffff;--dline:#e6e9f2;--dmu2:#8a92ad}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--dbg:#070a16;--dside:#0d1226;--dline:#20284a;--dmu2:#7d86ad}}
:root[data-theme="dark"]{--dbg:#070a16;--dside:#0d1226;--dline:#20284a;--dmu2:#7d86ad}
body.desk{background:var(--dbg);margin:0}
/* antes de entrar (abertura, conexão, análise): um cartão no centro da tela, sem moldura de celular */
.desk #device{width:440px;height:min(100%,780px);border:1px solid var(--dline);border-radius:22px;box-shadow:0 24px 70px rgba(14,21,48,.14)}
.desk.inapp #device{width:100%;height:100%;border:0;border-radius:0;box-shadow:none;background:var(--dbg)}
.desk.inapp #screen{overflow:hidden}
.desk.inapp .pg{min-height:0}
.dshell{display:grid;grid-template-columns:252px minmax(0,1fr);height:100%}
/* barra lateral */
.side{background:var(--dside);border-right:1px solid var(--dline);display:flex;flex-direction:column;padding:20px 14px 16px;overflow:auto;scrollbar-width:thin}
.side>.brand{padding:0 10px 18px;font-size:18px}
.nv{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--mu);text-align:left}
.nv:hover{background:var(--sf2);color:var(--tx)}
.nv.on{background:var(--acs);color:var(--ac)}
.nv .n{margin-left:auto;min-width:22px;text-align:center;font-size:12px;font-weight:700;background:var(--sf2);color:var(--mu);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.nv.on .n{background:var(--ac);color:#fff}
.nv .n.hi{background:var(--hi);color:#fff}
.sgh{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dmu2);margin:20px 10px 6px}
.nv.ct2{font-weight:500;font-size:14px;padding:7px 10px}
.side .acct{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 10px 4px;border-top:1px solid var(--dline)}
.side .acct .bd{flex:1;min-width:0}.side .acct b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .acct small{display:block;font-size:12px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .sts{font-size:12px;color:var(--mu);padding:8px 10px 0;display:flex;gap:6px;align-items:center;min-width:0}
.side .sts>span:last-child,.side .sts{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .sts svg{flex:none}
/* área principal */
.dmain{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.dtop{display:flex;align-items:center;gap:14px;padding:14px 28px;border-bottom:1px solid var(--dline);background:var(--dside);min-height:66px}
.dtop .tt2{min-width:0}
.dtop h1{font-size:19px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtop .sub{display:block;color:var(--mu);font-size:13px;margin-top:1px}
.dsearch{margin-left:auto;display:flex;align-items:center;gap:8px;width:min(400px,34vw);background:var(--sf2);border:1px solid transparent;border-radius:10px;padding:9px 12px;color:var(--mu);font-size:14px}
.dsearch:hover{border-color:var(--dline)}
.dsearch kbd{margin-left:auto;font:600 11px var(--font);border:1px solid var(--dline);border-radius:5px;padding:1px 5px;color:var(--dmu2)}
.dtop .icbtn{border-radius:10px}
.dnew{display:flex;align-items:center;gap:6px;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;background:var(--ac);color:#fff}
.dbody{flex:1;min-height:0;overflow:auto;padding:24px 28px 40px;scrollbar-width:thin}
.dbody.flush{padding:0;overflow:hidden}
.dwrap{max-width:820px;margin:0 auto;background:var(--sf);border:1px solid var(--dline);border-radius:16px}
.dwrap .pg{padding:24px 28px 30px}
/* painel */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--sf);border:1px solid var(--dline);border-radius:14px;padding:14px 16px;text-align:left;display:block;width:100%}
.kpi:hover{border-color:var(--ac)}
.kpi .kl{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--mu)}
.kpi b{display:block;font-size:28px;font-weight:800;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi small{display:block;font-size:12px;color:var(--mu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.red b{color:var(--hi)}.kpi.acc b{color:var(--ac)}
.dgrid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(300px,1fr);gap:20px;align-items:start}
.dcol{display:grid;gap:20px;min-width:0}
.panel{background:var(--sf);border:1px solid var(--dline);border-radius:14px;overflow:hidden;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--dline)}
.ph h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.ph .cnt{font-size:12px;font-weight:700;color:var(--mu);background:var(--sf2);border-radius:999px;padding:1px 8px}
.panel .empty{padding:26px 12px}
.tblw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
.tbl td{overflow:hidden}
.tbl .who2>span{min-width:0}
.tbl th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dmu2);padding:9px 12px;border-bottom:1px solid var(--dline);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--dline);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr[data-a]{cursor:pointer}.tbl tr[data-a]:hover td{background:var(--sf2)}
.tbl .who2{display:flex;align-items:center;gap:10px;min-width:0}
.tbl .who2 b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl .who2 small{display:block;font-size:12px;color:var(--mu)}
.tbl .ac2{font-weight:600}.tbl .ac2 small{display:block;font-weight:400;font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl .nw{white-space:nowrap}
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--me);flex:none}
.pdot.hi{background:var(--hi)}.pdot.lo{background:var(--lo)}
.cb{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:6px;padding:3px 8px;background:var(--sf2);color:var(--tx);white-space:nowrap}
.cb.hi{background:var(--hi-s);color:var(--hi)}.cb.me{background:var(--me-s);color:var(--me)}.cb.lo{background:var(--lo-s);color:var(--lo)}
.cb.ac{background:var(--acs);color:var(--ac)}
.okb{width:30px;height:30px;border-radius:50%;border:2px solid var(--dline);display:grid;place-items:center;color:var(--mu)}
.okb:hover{border-color:var(--lo);color:var(--lo)}
/* agenda da semana */
.wk .dy{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;padding:10px 16px;border-bottom:1px solid var(--dline)}
.wk .dy:last-child{border-bottom:0}
.wk .dd2{text-align:center;padding-top:2px}
.wk .dd2 b{display:block;font-size:18px;font-weight:800;line-height:1.1}
.wk .dd2 span{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--mu)}
.wk .dy.today .dd2 b,.wk .dy.today .dd2 span{color:var(--ac)}
.wk .dy.late .dd2 b,.wk .dy.late .dd2 span{color:var(--hi)}
.wk .it{display:flex;align-items:center;gap:8px;width:100%;padding:4px 0;font-size:13.5px;text-align:left;min-width:0}
.wk .it span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk .it em{font-style:normal;color:var(--mu);font-size:12px;flex:none;font-variant-numeric:tabular-nums}
.wk .none{font-size:13px;color:var(--dmu2);padding:4px 0}
.cbar{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:6px 10px;align-items:center;padding:8px 16px;width:100%;text-align:left}
.cbar:hover{background:var(--sf2)}
.cbar .cn{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;min-width:0}
.cbar .tr2{grid-column:1/2;height:6px;border-radius:4px;background:var(--sf2);overflow:hidden}.cbar .tr2 i{display:block;height:100%;background:var(--ac);border-radius:4px}
.cbar b{grid-row:1/3;grid-column:2;text-align:right;font-variant-numeric:tabular-nums}
.dbrief{background:var(--grad);color:#fff;border-radius:14px;padding:16px 18px}
.dbrief h3{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;opacity:.92;text-transform:uppercase;letter-spacing:.05em}
.dbrief p{margin-top:8px;font-size:14.5px;line-height:1.55}
/* mensagens: lista + leitura */
.dsplit{display:grid;grid-template-columns:minmax(380px,42%) minmax(0,1fr);height:100%}
.dlist{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--dline);background:var(--sf)}
.dlh{padding:14px 16px 10px;border-bottom:1px solid var(--dline)}
.dlh .chips{margin:0 0 10px}.dlh .chip{padding:6px 12px;font-size:13px}
.dlh .tools{display:flex;gap:8px;align-items:center}
.dlh .tools .sbar{margin:0;flex:1;padding:9px 12px;font-size:14px;border-radius:10px}
.dlh .tools .icbtn{width:38px;height:38px;background:var(--sf2)}
.dlh .tools .icbtn.on{background:var(--acs);color:var(--ac)}
.dls{flex:1;min-height:0;overflow:auto;scrollbar-width:thin}
.dls .gh{margin:0;padding:12px 16px 6px;background:var(--sf);position:sticky;top:0;z-index:1}
.drow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:12px;row-gap:3px;width:100%;padding:12px 16px 12px 13px;border-bottom:1px solid var(--dline);border-left:3px solid transparent;cursor:pointer;text-align:left}
.drow:hover{background:var(--sf2)}
.drow.on{background:var(--acs);border-left-color:var(--ac)}
.drow .av2{grid-row:1/5;align-self:start}
.drow .r1{display:flex;justify-content:space-between;gap:10px;min-width:0;grid-column:2/4}
.drow .r1 b{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow.unread .r1 b{font-weight:800}
.drow.unread .r1 b::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac);margin-left:7px;vertical-align:1px}
.drow .r1 span{font-size:12.5px;color:var(--mu);white-space:nowrap;font-variant-numeric:tabular-nums}
.drow .r2{grid-column:2/4;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow.unread .r2{font-weight:700}
.drow .r3{grid-column:2/4;font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .r3 .acx{color:var(--tx);font-weight:600;display:inline-flex;align-items:center;gap:5px}
.drow .r4{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.drow .chk{grid-row:1/5;margin:8px 0 0}
.dread{min-height:0;overflow:auto;background:var(--dbg);scrollbar-width:thin}
.dread .pg{max-width:780px;margin:22px auto;background:var(--sf);border:1px solid var(--dline);border-radius:16px;padding:20px 28px 28px;min-height:0}
.dread .dh [data-a="back"]{visibility:hidden}
.dread .qa{grid-template-columns:repeat(4,minmax(0,1fr))}
.dempty{display:grid;place-items:center;height:100%;text-align:center;color:var(--mu);padding:40px}
.dempty .tile{width:56px;height:56px;border-radius:16px;margin:0 auto 12px}
.dempty b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}
.dempty kbd{font:600 11px var(--font);border:1px solid var(--dline);border-radius:5px;padding:1px 5px}
/* tarefas: quadro por prazo */
.tbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.tbar .ring{margin:0}
.tbar .seg{width:auto}.tbar .seg button{padding:8px 16px}
.tbar .chips{margin:0}
.board{display:grid;grid-template-columns:repeat(5,minmax(186px,1fr));gap:14px;align-items:start;overflow-x:auto;padding-bottom:6px}
.bcol{background:var(--sf2);border:1px solid var(--dline);border-radius:14px;padding:10px;min-width:0}
.bcol h3{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;padding:4px 6px 10px}
.bcol h3 span{font-size:12px;color:var(--mu);background:var(--sf);border-radius:999px;padding:1px 8px}
.bcol.late h3{color:var(--hi)}.bcol.today h3{color:var(--ac)}
.tcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;width:100%;background:var(--sf);border:1px solid var(--dline);border-left:3px solid var(--me);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;text-align:left}
.tcard.hi{border-left-color:var(--hi)}.tcard.lo{border-left-color:var(--lo)}
.tcard:hover{box-shadow:var(--sh)}
.tcard .ck{width:22px;height:22px;border-width:2px;grid-row:1/4}
.tcard b{font-size:14px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.tcard small{font-size:12.5px;color:var(--mu);display:flex;align-items:center;gap:5px;min-width:0}
.tcard small span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard .ft{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.bcol .none{font-size:13px;color:var(--dmu2);padding:6px 6px 10px}
.dlist2 .tk{padding:12px 14px}
/* folhas viram janelas no centro; aviso embaixo, no centro */
.desk .sbg{position:fixed}
.desk .sheet{position:fixed;left:50%;right:auto;top:50%;bottom:auto;width:min(560px,92vw);max-height:86vh;border-radius:18px;padding:22px 26px 24px;transform:translate(-50%,-50%);animation:dpop .16s ease-out;box-shadow:0 30px 80px rgba(8,12,28,.3)}
@keyframes dpop{from{opacity:0;transform:translate(-50%,-47%)}to{opacity:1;transform:translate(-50%,-50%)}}

<script>/* ---------- DEMONSTRAÇÃO: caixa fictícia e camada no lugar do Google (não faz parte do aplicativo) ---------- */
window.SIM_MODO="demo";
/* Simulação do Assistence — a caixa do Gmail ARTIFICIAL de uma empreendedora fictícia.
   Aqui só estão as mensagens, como chegariam do Gmail (remetente, assunto, texto, anexos, rótulos). Nenhuma mensagem traz categoria,
   prioridade, tarefa ou prazo: quem organiza é o motor do Assistence, dentro do aplicativo, como faria com um Gmail de verdade.
   As datas são relativas ao momento em que a página abre (ex.: "há 2 horas", vencimento "daqui a 5 dias"), para a caixa estar
   sempre atual. Pessoas, empresas, domínios (.test), valores e documentos são inventados. */
const SIM_CAIXA=(function(){
  const EU={nome:"Camila Rocha",email:"camila.rocha@rochainteriores.test"};
  const P={
    juliana:"Juliana Prado <juliana.prado@pradoadvogados.test>",ricardo:"Ricardo Nunes <ricardo@nunesimoveis.test>",bruno:"Bruno Rocha <bruno@rochainteriores.test>",
    paula:"Paula Antunes <paula.antunes@clinicavida.test>",aurora:"Móveis Aurora <financeiro@moveisaurora.test>",contab:"Contábil Exata <atendimento@contabilexata.test>",
    banco:"Banco Fictício <avisos@bancoficticio.test>",revista:"Revista Morar Bem <news@morarbem.test>",loja:"Casa & Estilo <ofertas@casaestilo.test>",
    pinho:"Marcenaria Pinho <contratos@marcenariapinho.test>",luz:"Lumi Iluminação <vendas@lumiiluminacao.test>",marmore:"Marmoraria Pedra Fina <financeiro@pedrafina.test>",
    cortinas:"Cortinas Leve <cobranca@cortinasleve.test>",lara:"Lara Mendes <lara@rochainteriores.test>",obra:"Sérgio Alves <sergio.obras@gmail.test>",
    mae:"Mãe <helena.rocha@gmail.test>",rede:"Rede Profissional <notificacoes@redeprofissional.test>",cert:"Certifica Digital <avisos@certificadigital.test>",
    tecidos:"Tecidos Bella <pedidos@tecidosbella.test>",fabio:"Fábio Teixeira <fabio@teixeiraarquitetura.test>"};
  const eu=`${EU.nome} <${EU.email}>`;
  /* dd/mm daqui a n dias */
  const dia=(n,agora)=>{const d=new Date(agora+n*864e5);return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")};
  const pdf=(nome,kb)=>({nome,tipo:"application/pdf",tamanho:(kb||80)*1024});
  /* cada conversa: [remetente, texto, minutos atrás, extras]; "para" quando quem escreve é a Camila */
  const conversas=a=>[
    {assunto:"Orçamento do projeto da sala",msgs:[[P.juliana,"Oi, Camila! Tudo bem? Adorei as referências que você mandou. Pode me enviar o orçamento do projeto da sala até sexta?",2*1440+180],
      [P.juliana,"Camila, pensando melhor, pode ser até segunda, sem pressa. Obrigada!",300]]},
    {assunto:"Re: Orçamento do projeto da sala",msgs:[[P.juliana,"Reforçando: consegue me enviar o orçamento do projeto da sala? Quero apresentar para o meu marido no fim de semana.",95]]},
    {assunto:"Layout aprovado — apartamento 702",msgs:[[P.ricardo,"Camila, o layout do apartamento 702 está aprovado! Pode me mandar o contrato para assinatura?",1440+600],
      [eu,"Que ótimo, Ricardo! Envio o contrato amanhã cedo.",1440+540,{para:["ricardo@nunesimoveis.test"]}],
      [P.ricardo,"Perfeito. Aproveitando: podemos marcar uma reunião na quinta às 15h para alinhar a marcenaria?",120]]},
    {assunto:"Boleto - Pedido 4521",msgs:[[P.aurora,`Prezada Camila,\n\nSegue o boleto referente ao pedido 4521 (sofá e poltronas do projeto Prado), no valor de R$ 3.480,00, com vencimento em ${dia(5,a)}.\n\nAtenciosamente,\nFinanceiro Móveis Aurora`,6*60,{anexos:[pdf("boleto-pedido-4521.pdf",92)]}]]},
    {assunto:"DAS de outubro",msgs:[[P.contab,`Olá, Camila!\n\nSegue a guia do DAS de outubro, no valor de R$ 612,40, com vencimento em ${dia(2,a)}. Qualquer dúvida, estamos à disposição.\n\nEquipe Contábil Exata`,1440+200,{anexos:[pdf("DAS-outubro.pdf",60)]}]]},
    {assunto:"Pix recebido",msgs:[[P.banco,"Você recebeu um Pix de R$ 2.500,00 de RICARDO NUNES IMOVEIS LTDA. O valor já está disponível na sua conta.",50,{rotulos:["CATEGORY_UPDATES"],auto:true}]]},
    {assunto:"10 ideias de cozinhas compactas para 2027",msgs:[[P.revista,"Nesta edição: 10 ideias de cozinhas compactas, as cores do ano e uma entrevista exclusiva com designers de interiores. Leia agora no nosso site.\n\nPara deixar de receber, clique aqui.",8*60,{rotulos:["CATEGORY_PROMOTIONS"],lista:true}]]},
    {assunto:"Black Friday antecipada: até 40% OFF em luminárias",msgs:[[P.loja,"Só até domingo: até 40% de desconto em luminárias, tapetes e almofadas. Frete grátis acima de R$ 299,00. Aproveite!\n\nDescadastrar.",3*60,{rotulos:["CATEGORY_PROMOTIONS"],lista:true}]]},
    {assunto:"Fwd: Memorial descritivo da clínica",msgs:[[P.bruno,`Camila, pode cuidar disso, por favor? Estou sem agenda esta semana.\n\n---------- Forwarded message ---------\nDe: ${P.paula}\nDate: ${dia(-1,a)}\nSubject: Memorial descritivo da clínica\nTo: ${P.bruno}\n\nBruno, preciso do memorial descritivo da reforma da clínica até sexta, para enviar à vigilância sanitária.`,4*60]]},
    {assunto:"Boleto cortinas - projeto Nunes",msgs:[[P.cortinas,`Olá! Segue o boleto das cortinas do projeto Nunes, valor R$ 1.150,00, vencimento ${dia(3,a)}.`,3*1440,{anexos:[pdf("boleto-cortinas.pdf",70)]}]]},
    {assunto:"Comprovante de pagamento",msgs:[[eu,"Olá! Segue o comprovante do pagamento das cortinas do projeto Nunes.",1440,{para:["cobranca@cortinasleve.test"],anexos:[pdf("comprovante-pagamento.pdf",40)]}]]},
    {assunto:"Contrato de marcenaria - Apto 702",msgs:[[P.pinho,"Bom dia, Camila! Segue o contrato da marcenaria do apartamento 702 para assinatura. Assim que assinar, iniciamos a produção.",7*60,{anexos:[pdf("contrato-marcenaria-702.pdf",210)]}]]},
    {assunto:"Amostras de tecido",msgs:[[P.paula,"Camila, você pode me enviar as amostras de tecido para as poltronas da recepção?",2*1440],
      [P.paula,"Pode desconsiderar o pedido das amostras, já escolhemos o tecido direto na loja. Obrigada!",20*60]]},
    {assunto:"Visita técnica",msgs:[[P.obra,"Camila, a visita técnica na obra da clínica fica marcada para terça às 10h.",1440+300],
      [P.obra,"Correção: a visita técnica será na quarta às 10h, e não na terça. Desculpe a confusão.",180]]},
    {assunto:"Sinal - bancada de mármore",msgs:[[P.marmore,`Camila, segue a cobrança do sinal da bancada de mármore: R$ 2.200,00, com vencimento em ${dia(1,a)}.`,2*1440],
      [eu,"Paguei metade hoje, o restante pago semana que vem.",1440,{para:["financeiro@pedrafina.test"]}]]},
    {assunto:"Boletos de novembro",msgs:[[P.tecidos,`Seguem os boletos dos pedidos 88 e 91, ambos com vencimento em ${dia(4,a)}.`,10*60,{anexos:[pdf("boleto-pedido-88.pdf",60),pdf("boleto-pedido-91.pdf",60)]}],
      [eu,"Recebi, obrigada! Vou pagar os dois amanhã.",8*60,{para:["pedidos@tecidosbella.test"]}]]},
    {assunto:"Alerta de segurança: novo acesso",msgs:[[P.banco,"Detectamos um novo acesso à sua conta pelo aplicativo em um aparelho desconhecido. Se não foi você, bloqueie o acesso imediatamente pelo app.",35,{rotulos:["CATEGORY_UPDATES"],auto:true}]]},
    {assunto:"Plantas do projeto Prado",msgs:[[P.lara,"Camila, terminei as plantas do projeto Prado. Já estão na pasta do projeto, só para você saber.",5*60]]},
    {assunto:"URGENTE - planta elétrica",msgs:[[P.obra,"Urgente: o eletricista precisa da planta elétrica atualizada hoje à tarde. Pode me enviar?",25]]},
    {assunto:"Nota fiscal - Pedido 4521",msgs:[[P.aurora,"Prezada Camila, segue a nota fiscal referente ao pedido 4521. Esta é uma mensagem automática.",5*60,{anexos:[pdf("NF-e-4521.pdf",55)],auto:true}]]},
    {assunto:"Seu certificado digital vence em 15 dias",msgs:[[P.cert,`Olá! O seu certificado digital e-CNPJ vence em ${dia(15,a)}. Renove com antecedência para não ficar sem emitir notas fiscais.`,2*1440,{rotulos:["CATEGORY_UPDATES"],auto:true}]]},
    {assunto:"Você tem 3 novos convites para se conectar",msgs:[[P.rede,"Fábio Teixeira e mais 2 pessoas querem se conectar com você. Veja os convites.",9*60,{rotulos:["CATEGORY_SOCIAL"],lista:true,auto:true}]]},
    {assunto:"Almoço de domingo",msgs:[[P.mae,"Filha, vamos almoçar aqui em casa no domingo? Seu irmão vem também. Me avisa!",6*60]]},
    {assunto:"Fotos do apartamento",msgs:[[P.ricardo,"Camila, você conseguiu ver as fotos do apartamento que eu mandei ontem?",40]]},
    {assunto:"Orçamento iluminação - projeto Prado",msgs:[[P.luz,"Olá, Camila! Segue o orçamento solicitado para a iluminação do projeto Prado. Validade de 10 dias.",1440+60,{anexos:[pdf("orcamento-iluminacao-prado.pdf",130)]}]]},
    {assunto:"Parceria em projeto comercial",msgs:[[P.fabio,"Oi, Camila! Sou arquiteto e estou com um projeto comercial grande para o ano que vem. Você teria interesse em uma parceria? Podemos conversar por telefone?",15*60]]}
  ];
  /* ---------- formato da API do Gmail ---------- */
  const b64url=s=>{const b=new TextEncoder().encode(s);let bin="";b.forEach(x=>bin+=String.fromCharCode(x));return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
  const rfc=ms=>new Date(ms).toUTCString().replace("GMT","+0000");
  /* opc.conversas: outra lista de conversas (ex.: as que "chegam" durante a demonstração); opc.prefixo: prefixo dos ids */
  function gerar(agora,opc){
    const threads=[],mensagens=new Map(),lista=opc&&opc.conversas?opc.conversas(agora):conversas(agora),pre=opc&&opc.prefixo||"sim";
    lista.forEach((c,k)=>{const tid=pre+String(k+1).padStart(3,"0");let hid=1000+k*10;
      const msgs=c.msgs.map(([de,texto,min,x],i)=>{x=x||{};const id=tid+"m"+i,ts=agora-min*60000,minha=de===eu;
        const labels=minha?["SENT"]:["INBOX",...(min<36*60?["UNREAD"]:[]),...(x.rotulos||[])];
        const headers=[{name:"From",value:de},{name:"To",value:minha?(x.para||[]).join(", "):eu},{name:"Subject",value:c.assunto},{name:"Date",value:rfc(ts)}];
        if(x.lista)headers.push({name:"List-Unsubscribe",value:"<mailto:sair@"+de.split("@")[1].replace(">","")+">"},{name:"Precedence",value:"bulk"});
        if(x.auto)headers.push({name:"Auto-Submitted",value:"auto-generated"});
        const corpo={mimeType:"text/plain",headers:[{name:"Content-Type",value:"text/plain; charset=UTF-8"}],body:{size:texto.length,data:b64url(texto)}};
        const payload=x.anexos?{mimeType:"multipart/mixed",headers,parts:[{partId:"0",...corpo},...x.anexos.map((a,j)=>({partId:String(j+1),mimeType:a.tipo,filename:a.nome,
          headers:[{name:"Content-Type",value:a.tipo+'; name="'+a.nome+'"'},{name:"Content-Disposition",value:'attachment; filename="'+a.nome+'"'}],body:{attachmentId:id+"a"+j,size:a.tamanho}}))]}:{...corpo,headers:headers.concat(corpo.headers)};
        const m={id,threadId:tid,labelIds:labels,snippet:texto.slice(0,120),historyId:String(hid+i),internalDate:String(ts),sizeEstimate:texto.length+500,payload};
        mensagens.set(id,m);return m});
      threads.push({id:tid,historyId:String(hid+msgs.length),messages:msgs})});
    return{threads,mensagens};
  }
  /* demonstração: conversas que chegam alguns minutos depois de abrir o aplicativo (cada uma gerada no momento em que chega) */
  const chegadas=[
    {aposSegundos:40,c:a=>[{assunto:"Contrato revisado - projeto Prado",msgs:[[P.juliana,"Camila, revisei o contrato do projeto Prado com as alterações que conversamos. Pode me enviar o contrato assinado até amanhã às 12h? Preciso protocolar ainda esta semana.",0,{anexos:[pdf("contrato-projeto-prado-v3.pdf",210)]}]]}]},
    {aposSegundos:100,c:a=>[{assunto:"Aluguel da sala comercial - novembro",msgs:[["Imobiliária Central <cobranca@imobcentral.test>",`Olá! Segue o boleto do aluguel da sala comercial referente a novembro, no valor de R$ 2.300,00, com vencimento em ${dia(5,a)}.`,0,{anexos:[pdf("boleto-aluguel-novembro.pdf",60)],auto:true}]]}]},
    {aposSegundos:180,c:a=>[{assunto:"Projeto de cozinha",msgs:[["Carla Mendes <carla.mendes@gmail.test>","Oi, Camila! Vi o seu trabalho no Instagram e gostaria de um orçamento para o projeto da minha cozinha. Você conseguiria fazer uma visita na próxima semana?",0]]}]}
  ];
  return{EU,gerar,chegadas,total:conversas(Date.now()).length};
})();

/* Simulação do Assistence — a camada que faz o aplicativo de verdade conversar com o Gmail ARTIFICIAL.
   O aplicativo (public/index.html, com o motor do Assistence) roda sem nenhuma mudança: ele "entra no Google", lista as conversas e lê cada uma
   pela API do Gmail, exatamente como faria com uma conta real. Esta camada só responde no lugar do Google:
     - o login do Google vira uma janela de simulação (sem senha), que só aceita a conta artificial;
     - os pedidos à API do Gmail (perfil, lista de conversas, conversa completa, enviados) recebem as mensagens de simulacao/caixa.js;
     - nenhum Gmail real, conector ou servidor é acessado (o conector do Gmail do Claude fica bloqueado nesta página).
   Toda a organização (categoria, prioridade, tarefas, prazos, valores, resumo) é feita pelo motor, dentro do aplicativo. */
(function(){
  /* modo: "simulacao" (padrão: login simulado) ou "demo" (entra sozinho e recebe mensagens novas com o tempo) */
  const DEMO_MODO=window.SIM_MODO==="demo";
  const AGORA=Date.now(),{threads,mensagens}=SIM_CAIXA.gerar(AGORA),EU=SIM_CAIXA.EU;
  /* demonstração: as conversas que "chegam" depois de abrir, cada uma com a hora em que chegou */
  const fila=DEMO_MODO?SIM_CAIXA.chegadas.map((x,k)=>({...x,k,quando:AGORA+x.aposSegundos*1000,chegou:false})):[];
  function chegar(item,quando){if(item.chegou)return;item.chegou=true;
    const g=SIM_CAIXA.gerar(quando,{conversas:item.c,prefixo:"chg"+item.k+"-"});g.threads.forEach(t=>threads.push(t));g.mensagens.forEach((m,id)=>mensagens.set(id,m))}
  const conferirChegadas=()=>{const ag=Date.now();fila.filter(x=>!x.chegou&&x.quando<=ag).forEach(x=>chegar(x,x.quando))};
  const naCaixa=threads.filter(t=>t.messages.some(m=>m.labelIds.includes("INBOX"))).length,nMsgs=mensagens.size;
  const GAPI="https://gmail.googleapis.com/gmail/v1/users/me";
  /* 1. nada de Gmail real: o conector do Claude não é usado nesta página */
  try{if(window.claude&&typeof window.claude.use==="function"){const u=window.claude.use.bind(window.claude);
    window.claude.use=n=>n==="mcp"?Promise.reject(Object.assign(new Error("simulação: sem conector"),{code:"no_mcp"})):u(n)}}catch(e){}
  /* 2. respostas da API do Gmail */
  const json=(o,st)=>new Response(JSON.stringify(o),{status:st||200,headers:{"content-type":"application/json"}});
  const copia=o=>JSON.parse(JSON.stringify(o));
  const ultima=t=>Math.max(...t.messages.map(m=>+m.internalDate));
  function gmail(u){
    conferirChegadas();
    const url=new URL(u),p=url.pathname.replace("/gmail/v1/users/me",""),q=url.searchParams.get("q")||"";
    if(p==="/profile")return json({emailAddress:EU.email,messagesTotal:mensagens.size,threadsTotal:threads.length,historyId:"9999"});
    if(p==="/threads"){const L=threads.filter(t=>t.messages.some(m=>m.labelIds.includes("INBOX"))).sort((a,b)=>ultima(b)-ultima(a));
      const max=+url.searchParams.get("maxResults")||100;return json({threads:L.slice(0,max).map(t=>({id:t.id,historyId:t.historyId,snippet:t.messages[t.messages.length-1].snippet})),resultSizeEstimate:L.length})}
    let m=p.match(/^\/threads\/([^/]+)$/);if(m){const t=threads.find(x=>x.id===decodeURIComponent(m[1]));return t?json(copia(t)):json({error:{code:404}},404)}
    if(p==="/messages"){const L=/in:sent/.test(q)?[...mensagens.values()].filter(x=>x.labelIds.includes("SENT")):[...mensagens.values()];return json({messages:L.map(x=>({id:x.id,threadId:x.threadId})),resultSizeEstimate:L.length})}
    m=p.match(/^\/messages\/([^/]+)$/);if(m){const x=mensagens.get(decodeURIComponent(m[1]));if(!x)return json({error:{code:404}},404);
      if(url.searchParams.get("format")==="metadata"){const quer=url.searchParams.getAll("metadataHeaders").map(h=>h.toLowerCase());
        return json({id:x.id,threadId:x.threadId,labelIds:x.labelIds,internalDate:x.internalDate,payload:{headers:x.payload.headers.filter(h=>!quer.length||quer.includes(h.name.toLowerCase()))}})}
      return json(copia(x))}
    return json({error:{code:404,message:"não existe nesta simulação"}},404);
  }
  const fetchReal=window.fetch.bind(window);
  window.fetch=async(entrada,opcoes)=>{const u=typeof entrada==="string"?entrada:entrada&&entrada.url||String(entrada);
    if(u.startsWith(GAPI)){await new Promise(r=>setTimeout(r,25+Math.random()*60));return gmail(u)}
    /* sem servidor nesta simulação: o aplicativo usa o modo "Google" */
    if(/^\/(api|auth)\//.test(u)||u.startsWith(location.origin+"/api/"))return json({error:"sem servidor na simulação"},404);
    return fetchReal(entrada,opcoes)};
  /* 3. login do Google simulado (sem senha; só a conta artificial) */
  function janela(dica,fim){
    const w=document.createElement("div");w.className="simj";w.setAttribute("role","dialog");w.setAttribute("aria-modal","true");w.setAttribute("aria-label","Entrar na conta simulada");
    w.innerHTML=`<div class="simj-c"><span class="simj-tag">Simulação</span><h2>Entrar na conta de teste</h2>
      <p>Esta é uma conta de Gmail <b>artificial</b>, criada só para este teste: ${nMsgs} mensagens em ${naCaixa} conversas da caixa de entrada de uma empreendedora fictícia. Nenhum Gmail real é acessado e não há senha.</p>
      <div class="simj-conta"><b>${EU.nome}</b><span>${EU.email}</span><button type="button" class="simj-usar">Usar esta conta</button></div>
      <label for="simj-email">E-mail</label><input id="simj-email" type="email" autocomplete="off" placeholder="${EU.email}" value="${dica&&dica.toLowerCase()===EU.email?dica:""}">
      <p class="simj-erro" hidden></p>
      <div class="simj-b"><button type="button" class="simj-n">Cancelar</button><button type="button" class="simj-s">Entrar e permitir a leitura</button></div>
      <small>Permissão pedida, como no aplicativo real: ler os e-mails (somente leitura).</small></div>`;
    document.body.appendChild(w);const inp=w.querySelector("input"),erro=w.querySelector(".simj-erro");setTimeout(()=>inp.focus(),30);
    const sair=r=>{w.remove();fim(r)};
    w.querySelector(".simj-usar").onclick=()=>{inp.value=EU.email;inp.focus()};
    w.querySelector(".simj-n").onclick=()=>sair(false);
    const ok=()=>{if(inp.value.trim().toLowerCase()!==EU.email){erro.hidden=false;erro.textContent="Nesta simulação só existe a conta "+EU.email+".";return}sair(true)};
    w.querySelector(".simj-s").onclick=ok;inp.onkeydown=e=>{if(e.key==="Enter")ok();if(e.key==="Escape")sair(false)};
  }
  window.google={accounts:{oauth2:{
    initTokenClient:cfg=>({requestAccessToken:o=>DEMO_MODO?setTimeout(()=>cfg.callback({access_token:"demonstracao-"+Date.now(),expires_in:3600,scope:cfg.scope,token_type:"Bearer"}),120):janela(o&&o.login_hint,ok=>{
      if(!ok){(cfg.error_callback||(()=>{}))({type:"popup_closed"});return}
      cfg.callback({access_token:"simulacao-"+Date.now(),expires_in:3600,scope:cfg.scope,token_type:"Bearer"})})}),
    hasGrantedAllScopes:()=>true,revoke:(t,cb)=>{cb&&cb({successful:true})}}}};
  /* 4. aviso fixo de simulação, com "recomeçar" */
  const css=document.createElement("style");css.textContent=`
    .simj{position:fixed;inset:0;z-index:9999;background:rgba(10,14,30,.5);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-left,0px))}

    tk.forEach(t=>{if(m.vocab.has(t))s+=Math.log(((T[t]||0)+1)/(C.t+V))});lp[c]=s});

function pontuarPessoal(s){
  if(!s.cats.includes("Pessoal"))return;

  const nucleo=2*countKw(KW_PESSOAL,s.n_sub)+countKw(KW_PESSOAL,s.n_body);

/* M9: verbos que precisam de objeto. Sem objeto ("Pode me enviar?"), o objeto vem do que a mensagem acabou de citar

const TK_COM_OBJETO=new Set(["Enviar","Reenviar","Entregar","Devolver","Assinar","Revisar","Aprovar","Preencher","Atualizar","Corrigir","Providenciar","Anexar","Imprimir"]);
const RE_TK_ANTEC=/\b(?:precisa|preciso|precisamos|precisam|pediu|pediram|pede|pedem|solicitou|solicitaram|quer|querem|aguarda|aguardam|necessita|falta|faltou|faltam)\s+(?:d[oa]s?\s+|de\s+|o\s+|a\s+|os\s+|as\s+)+/g;

function tkAntecedente(t,ini,pos){

  for(const re of [RE_TK_ANTEC,RE_TK_ENTREG_ART]){re.lastIndex=0;
    while((m=re.exec(trecho))){

      if(re===RE_TK_ENTREG_ART&&/\b(segue|seguem|envio|enviamos|estou enviando|anexo|anexei|anexamos|recebi|recebemos|vi|vimos|mandei|enviei|mandou|enviou|ja)\s+(?:\S+\s+){0,3}$/.test(trecho.slice(0,m.index)))continue;
      const a=de+m.index+m[0].length;if(!melhor||a>melhor)melhor=a}}
  if(melhor!=null){const [fa,fb]=limitesFrase(t,melhor,melhor);const o=tkObjeto(t,melhor,Math.min(fb,pos));if(o)return{obj:o,frase:[fa,fb]}}

  const assunto=t.slice(0,Math.max(0,ini-1)),px=assunto.match(RE_TK_ASSUNTO_PREFIXO),k=px?px[0].length:0;
  if(RE_TK_ENTREGAVEL.test(assunto.slice(k))){const o=tkObjeto(t,k,Math.max(0,ini-1));if(o)return{obj:o,frase:null}}

/* M6.2: texto de UMA mensagem, preparado: normalizado, com o mapa para o original e as datas válidas, calculadas a partir
   da data da própria mensagem ("amanhã" escrito há três dias é o dia seguinte ao da mensagem) */
function prepararTexto(assunto,texto,ref,now){
  const ext=datasDaMensagem(assunto,texto,ref,now||ref,{}),t=ext.t,orig=String(assunto||"")+"\n"+String(texto||""),mapa=nrmMapa(orig);
  return{t,ini:t.indexOf("\n")+1,ref,C:ext.C,validas:ext.C.filter(c=>dataValida(c,t,ext.C)),
    original:(a,b)=>mapa.pos?orig.slice(mapa.pos[a],mapa.pos[Math.min(b,mapa.pos.length-1)]):t.slice(a,b)};

/* frases do corpo (sem o assunto): [início, fim] no texto normalizado */
function frasesDo(tm){
  const t=tm.t,out=[];let a=tm.ini;
  for(let k=tm.ini;k<=t.length;k++){
    if(k===t.length||/[\n!?]/.test(t[k])||t[k]==="."&&(k+1>=t.length||/\s/.test(t[k+1]))){if(k>a)out.push([a,k+1]);a=k+1}
  }

/* pedidos de uma mensagem (M5, agora por mensagem): devolve as tarefas pedidas, com o prazo de cada uma, e se há pedido real */

      achados.push({pos,texto:rot+" "+o,verbo:rot,frase,origem,fraseAlt:an.frase});return}
    else if(rot!=="Confirmar"&&!pt)return;          /* sem objeto, só "Confirmar" e "Ligar" fazem sentido sozinhos */
    if(rot==="Agendar"&&!obj)return;

  const frases=frasesDo(tm);
  let askVisto=false;
  for(const [fa,fb] of frases){
    const f=t.slice(fa,fb);
    if(!f.trim())continue;
    if(RE_TK_CORTESIA.test(f))continue;
    const cancel=RE_TK_CANCEL.test(f);

      if(fo.modo==="inf"&&!modal)continue;

      if(fo.modo==="inf2"&&!/^me /.test(fo.f)&&!(/\b(me|nos)\s+$/.test(antes)||/^[\s\d).:-]*$/.test(antes)&&/^\s+(o|a|os|as|um|uma|esse|essa|seu|sua|meu|minha)\s/.test(f.slice(m.index+m[0].length))))continue;
      /* artigo antes: é substantivo ("o cheque", "a análise", "a escolha") */
      if(/\b(o|a|os|as|um|uma|seu|sua|do|da|no|na|pela|pelo)\s+$/.test(antes))continue;
      if(fo.modo==="imp"&&/\b(para|pra|de|ao|sem|que|quando|se)\s+$/.test(antes)&&!modal)continue;
      askVisto=true;
      /* M6.2: verbo seguido de lugar ("entregar em São Paulo", "enviar no portal") não tem objeto */
      const lugar=/^\s+(?:em|no|na|nos|nas|ao|aos|pelo|pela)\s/.test(t.slice(p+m[0].length,fb));
      const obj=fo.rot==="Ligar"||lugar?null:tkObjeto(t,p+m[0].length,fb);

      /* M9: objetos coordenados ("o contrato e a planta baixa"): uma tarefa para cada um */

      const p=fa+m.index,antes=t.slice(fa,p);
      if(RE_TK_NEG.test(antes)||cancel)continue;

      const obj=tkObjeto(t,p+m[0].length,fb);if(!obj)continue;

      const obj=tkObjeto(t,fa+iniS,p);

      askVisto=true;

        continue}

      while((q=r.exec(f))){const antes=t.slice(fa,fa+q.index);if(!RE_TK_NEG.test(antes)&&!RE_TK_EU.test(antes)){askVisto=true;break}}}

  achados.sort((x,y)=>x.pos-y.pos);

/* M5.1: uma tarefa de pagamento para cada cobrança com data, cada uma com o SEU vencimento.

     - vencimento ("vence em 15/11", "venceu em 30/10");
     - prazo numa frase que manda pagar uma conta ("pague o boleto até 10/11").

   pedido para você EMITIR a cobrança (mesmas expressões do módulo 58). O nome vem da conta citada logo antes da data

/* ---------- análise, etapa 1: leitura da conversa ----------

function lerConversa(M,ctx){
  const s={M,ctx,motivos:[]};
  s.now=ctx.now||new Date();s.cats=ctx.cats||ORDER;s.sens=ctx.sens||"eq";
  s.th=M.thread||[];

  s.lastWho=(s.th[s.th.length-1]||{}).who||"them";
  s.cleanTxt=lastThem.clean!=null?lastThem.clean:stripQuoted(lastThem.body);

/* ---------- análise, etapa 2: sinais de automação e de relacionamento ---------- */
function sinaisAutomacao(s){

  s.promoLbl=labels.includes("CATEGORY_PROMOTIONS");s.socialLbl=labels.includes("CATEGORY_SOCIAL");s.forumLbl=labels.includes("CATEGORY_FORUMS");s.updLbl=labels.includes("CATEGORY_UPDATES");
